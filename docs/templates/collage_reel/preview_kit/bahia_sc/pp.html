<h2>Legenda do post</h2><textarea id="ppLeg" readonly>COMPARTILHA NOS STORIES 🔁 e manda pros Melhores Amigos ⭐

Recebemos a pergunta: o PT há 20 anos na Bahia × Santa Catarina, nunca governada pelo PT. Onde está melhor? 🔎

A resposta começa antes de qualquer governo: o PONTO DE PARTIDA.

✔️ A Bahia carrega séculos de escravidão e latifúndio. Santa Catarina recebeu imigrantes com acesso a terra
✔️ Até hoje, a renda por pessoa em SC (R$ 2.809) é quase o dobro da Bahia (R$ 1.465)
✔️ Mesmo partido, resultado oposto: PL em SC (7,6) e no Rio (22,6); PT no Piauí (17,1) e na Bahia (36,8)
✔️ A presidência foi a mesma pros dois estados. Polícia e investigação são do governo do estado

Por isso, compare estados da mesma região. Parte 1 no perfil. 👆
Fontes no primeiro comentário.
