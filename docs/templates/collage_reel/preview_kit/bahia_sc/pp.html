<h2>Legenda do post</h2><textarea id="ppLeg" readonly>COMPARTILHA NOS STORIES 🔁 e manda pros Melhores Amigos ⭐

&quot;O PT governa a Bahia há 20 anos, e Santa Catarina nunca teve o PT. Onde está melhor?&quot; Recebemos esse comentário e fomos aos números. 🔎

✔️ O PL governava Santa Catarina (7,6 mortes por 100 mil) e o Rio (22,6): quase o triplo, com o mesmo partido
✔️ O PT governa o Piauí (17,1) e a Bahia (36,8): mais que o dobro, com o mesmo partido
✔️ No Nordeste, estados de esquerda e de direita estão no mesmo patamar
✔️ Em 2025, 8 de 9 estados do Nordeste reduziram as mortes

Polícia, presídios e investigação são do governo do estado. Comparar Sul com Nordeste é comparar ponto de partida, não governo.
