# ============================================================
# TIER 1 — HIGH COST: Sonnet/Opus, frequent runs
# These are the primary credit consumers.
# ============================================================
pipelines:

  - id: capture_pipeline
    workflow: .github/workflows/capture_pipeline.yml
    triggered_by:
      - "capture_queue.yml (scheduled — 1x/day after WP-0)"
      - "scheduled_capture_poll.yml (scheduled — 2x/day after WP-0)"
      - "manual workflow_dispatch"
    description: >
      Main capture pipeline. Downloads video/article, transcribes, builds content brief.
      Not on a cron itself — dispatched by the two queue workflows below.
    model_primary: "claude-sonnet-4-6 (carousel_builder.py:817)"
    model_fallback: "claude-haiku-4-5-20251001 → OpenAI cascade (llm_router.py)"
    llm_calls_per_run: "2–5 Sonnet calls per URL captured"
    daily_runs_pre_wp0: 8  # 4 pairs via 4 crons confirmed Jul 23
    daily_runs_post_wp0: 3  # 2 from scheduled_capture_poll + 1 from capture_queue
    paused: false
    wp0_note: "Schedule reduced; daily cap enforcement is config (max_urls=2/run) not hard code."

  - id: capture_queue
    workflow: .github/workflows/capture_queue.yml
    schedule:
      cron: "0 11 * * *"  # 6 AM EDT / 7 AM EST
      wp0_change: "WAS 2 crons (DST pair 11+12 UTC, both fired daily). NOW 1 cron. Fixed 2026-07-23 at lines 15-18."
    description: "Processes capture queue — dispatches capture_pipeline per pending URL (default max 2/run)"
    model_primary: "(via capture_pipeline)"
    dispatch_chain: capture_pipeline
    paused: false
    wp0_status: FIXED

  - id: scheduled_capture_poll
    workflow: .github/workflows/scheduled_capture_poll.yml
    schedule:
      crons:
        - "0 12 * * *"  # 8 AM EDT / 9 AM EST
        - "0 17 * * *"  # 1 PM EDT / 2 PM EST
      wp0_change: "WAS 4 crons (2 DST pairs: 12/13+17/18 UTC, all fired daily). NOW 2. Fixed 2026-07-23 at lines 5-10."
    description: "Polls capture queue and dispatches capture_pipeline for pending items"
    model_primary: "(via capture_pipeline)"
    dispatch_chain: capture_pipeline
    paused: false
    wp0_status: FIXED

  - id: photo_catalog
    workflow: .github/workflows/photo-catalog.yml
    schedule:
      cron: "35 23 * * *"  # 7:35 PM ET daily
    description: "Daily scan of OPC Drive photos — Opus vision to label/catalog new photos"
    script: scripts/photo_catalog_cloud.py
    model_primary: "claude-opus-4-6 (photo_catalog_cloud.py:201) — EXPENSIVE"
    model_fallback: "claude-haiku-4-5-20251001 (photo_catalog_cloud.py:334)"
    llm_calls_per_run: "1 Opus vision call per NEW photo in Drive"
    paused: false
    wp0_status: ACTIVE_RECOMMENDED_PAUSE
    only_you_action: "gh workflow disable photo-catalog.yml"

  - id: higashi_photo_catalog
    workflow: .github/workflows/higashi_photo_catalog.yml
    schedule:
      cron: "15 9 * * *"  # 5:15 AM ET daily
    description: "Daily scan of Higashi Drive photos — Haiku vision, up to 100 photos/run"
    script: scripts/higashi_photo_catalog_cloud.py
    model_primary: "claude-haiku-4-5-20251001 (higashi_photo_catalog_cloud.py:207)"
    llm_calls_per_run: "up to 100 Haiku vision calls per run"
    paused: false
    wp0_status: ACTIVE_RECOMMENDED_PAUSE
    only_you_action: "gh workflow disable higashi_photo_catalog.yml"

  - id: research
    workflow: .github/workflows/research.yml
    schedule:
      cron: "15 11 */2 * *"  # 7:15 AM ET every 2 days
    description: "Content research — YouTube/web ideas feed for blog + social posts"
    script: scripts/research.js
    model_primary: "claude-sonnet-4-5 (research.js:219)"
    model_fallback: "gpt-4o-mini (research.js:279)"
    paused: false
    wp0_status: ACTIVE_RECOMMENDED_PAUSE
    only_you_action: "gh workflow disable research.yml"

  - id: fill_missing
    workflow: .github/workflows/fill-missing.yml
    schedule:
      cron: "0 17 * * *"  # 1 PM ET daily (same hour as scheduled_capture_poll second run!)
    description: "Fills missing metadata fields in Content Queue using LLM"
    script: scripts/fill-missing.js
    model_primary: "claude-sonnet-4-5 (fill-missing.js:219)"
    model_fallback: "gpt-4o-mini (fill-missing.js:279)"
    llm_calls_per_run: "~8 Sonnet calls per run (estimate from Addendum v7)"
    paused: false
    wp0_status: ACTIVE_RECOMMENDED_PAUSE
    only_you_action: "gh workflow disable fill-missing.yml"
    schedule_conflict: "Runs at same UTC hour (17:00) as scheduled_capture_poll second cron — competes for credits"

  - id: pipeline_self_heal
    workflow: .github/workflows/pipeline_self_heal.yml
    schedule:
      cron: "0 */5 * * *"  # every 5 hours (was every 2h; cost-cut 2026-05-07)
    description: "Auto-resolves pipeline failures — runs orchestrator.py against pending failures"
    script: scripts/self_heal/orchestrator.py
    model_primary: "claude-sonnet (via orchestrator — confirmed from workflow context)"
    llm_calls_per_run: "1+ Sonnet calls per pending failure; runs 5x/day = up to 5+ Sonnet calls/day"
    paused: false
    wp0_status: ACTIVE_RECOMMENDED_PAUSE
    only_you_action: "gh workflow disable pipeline_self_heal.yml"

  - id: 4am_agent
    workflow: .github/workflows/4am_agent.yml
    schedule:
      cron: "0 8 */2 * *"  # every other day, 4 AM ET
    description: "4AM pattern learner + topic finder + YouTube research. Previously auto-dispatched content_creator."
    model_primary: "claude-sonnet (via pattern_learner.py + youtube research)"
    dispatch_chain_pre_wp0: "could auto-dispatch content_creator.yml on every scheduled run"
    dispatch_chain_post_wp0: "content_creator dispatch gated: only fires on workflow_dispatch with retry_content_creator=true"
    paused: false
    wp0_status: GATED
    wp0_note: "Dispatch gate confirmed at 4am_agent.yml lines 100-104. Scheduled runs no longer auto-trigger content_creator."
    only_you_action: "gh workflow disable 4am_agent.yml  # optional since dispatch is gated"

