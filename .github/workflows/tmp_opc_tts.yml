name: tmp-opc-tts
on:
  push:
    branches: [tmp-opc-obra-real]
    paths: [job/job.json]
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -U edge-tts && cd job && python tts.py
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add job/out && git commit -m "tts out" && git push
