name: tmp reel comida cara
on:
  push:
    branches: [tmp-comida-cara]
    paths: ['job/job.json']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: pip install edge-tts google-api-python-client google-auth faster-whisper "rembg[cpu]" mediapipe==0.10.14 opencv-python-headless pillow numpy
      - name: build
        env:
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
        run: python job/run.py
      - name: commit
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add out && git commit -m "out" && git push || echo nothing
