name: tmp-ana-clara
on:
  push:
    branches: [tmp-ana-clara]
    paths: ['tmpjob/**', '.github/workflows/tmp-ana-clara.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: tmp-ana-clara }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q edge-tts requests pillow numpy "rembg[cpu]" "mediapipe==0.10.14" opencv-python-headless
      - run: python tmpjob/job.py
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add out; git commit -m "out [skip ci]" || true; git push
