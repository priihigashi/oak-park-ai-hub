name: tmp download reel DfDMoVXsEBQ
on:
  push:
    branches: [tmp-reel-dl2]
permissions:
  contents: write
jobs:
  dl:
    if: "!contains(github.event.head_commit.message, 'result')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q yt-dlp && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: yt-dlp -f "bv*+ba/b" --merge-output-format mp4 -o src2.mp4 "https://www.instagram.com/reel/DfDMoVXsEBQ/"
      - run: |
          git config user.email noreply@anthropic.com; git config user.name Claude
          git add src2.mp4 && git commit -m "result" && git push
