name: tmp fetch dub audio
on:
  push:
    branches: [tmp-reel-dl2]
    paths: ['urls.txt']
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p el
          while read n u; do curl -s -f -o "el/$n.mp3" "$u" || echo "FAIL $n"; done < urls.txt
          ls -la el
      - run: |
          git config user.email noreply@anthropic.com; git config user.name Claude
          git add el && git commit -m "result el audio" && git push
