name: OPC Ads Dashboard — Weekly Refresh

on:
  schedule:
    - cron: '0 12 * * 1'   # Every Monday 8 AM ET (12:00 UTC)
  workflow_dispatch:         # Manual trigger anytime

permissions:
  contents: write
  pull-requests: write   # helper opens+merges a PR (see scripts/ci/push_prevalidated_main.sh)

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # full history: push_prevalidated_main.sh may rebase onto a moved main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-ads

      - name: Refresh dashboard
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID:       ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET:   ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN:   ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          PRI_OP_GMAIL_APP_PASSWORD:  ${{ secrets.PRI_OP_GMAIL_APP_PASSWORD }}
          SHEETS_TOKEN:               ${{ secrets.SHEETS_TOKEN }}
          OPC_ADS_SHEET_ID:           ${{ secrets.OPC_ADS_SHEET_ID }}
        run: python scripts/ads_dashboard.py

      - name: Commit updated dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard/index.html docs/dashboard/dark.html
          if git diff --staged --quiet; then
            echo "Dashboard unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh ads dashboard $(date -u +%Y-%m-%d)"
          # main is protected by ruleset 20720805 with no bypass actors, so a
          # direct `git push` is rejected. Land through the gate instead.
          bash scripts/ci/push_prevalidated_main.sh ads-pulse

      - name: Email alert on failure
        if: failure()
        env:
          PRI_OP_GMAIL_APP_PASSWORD: ${{ secrets.PRI_OP_GMAIL_APP_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import os, smtplib
          from email.message import EmailMessage
          msg = EmailMessage()
          msg['Subject'] = '🚨 ads_pulse.yml FAILED — run ${{ github.run_id }}'
          msg['From'] = 'priscila@oakpark-construction.com'
          msg['To']   = 'priscila@oakpark-construction.com'
          msg.set_content(
              "ads_pulse.yml failed on run ${{ github.run_id }}.\n\n"
              "Logs: https://github.com/priihigashi/oak-park-ai-hub/actions/runs/${{ github.run_id }}\n"
          )
          s = smtplib.SMTP_SSL('smtp.gmail.com', 465)
          s.login('priscila@oakpark-construction.com', os.environ['PRI_OP_GMAIL_APP_PASSWORD'])
          s.send_message(msg)
          s.quit()
          PYEOF
