name: OPC Ads Reporting Pulse — Weekly Refresh

on:
  schedule:
    - cron: '0 12 * * 1'   # Every Monday 8 AM ET (12:00 UTC)
  workflow_dispatch:         # Manual trigger anytime

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-ads

      - name: Refresh Ads reporting data (Sheets only)
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID:       ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET:   ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN:   ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          SHEETS_TOKEN:               ${{ secrets.SHEETS_TOKEN }}
          OPC_ADS_SHEET_ID:           ${{ secrets.OPC_ADS_SHEET_ID }}
        run: |
          set -euo pipefail
          python scripts/ads_dashboard.py 2>&1 | tee /tmp/ads-pulse.log

          # The public dashboard files were intentionally removed in the privacy
          # migration. This workflow now updates only the private reporting sink
          # (Sheets) until FP-0179 chooses the private dashboard home.
          if grep -Eiq 'Ads sheet write failed|Traceback|unauthorized|\b401\b|\b403\b|permission denied|exception' /tmp/ads-pulse.log; then
            echo 'ERROR: Ads reporting pulse logged a data/write failure.' >&2
            exit 1
          fi
          if ! grep -Fq 'Ads sheet updated:' /tmp/ads-pulse.log; then
            echo 'ERROR: Ads reporting pulse did not prove that the Sheets sink was updated.' >&2
            exit 1
          fi

      - name: Email alert on failure
        if: failure()
        env:
          PRI_OP_GMAIL_APP_PASSWORD: ${{ secrets.PRI_OP_GMAIL_APP_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import os, smtplib
          from email.message import EmailMessage
          msg = EmailMessage()
          msg['Subject'] = '🚨 ads_pulse.yml FAILED — run ${{ github.run_id }}'
          msg['From'] = 'priscila@oakpark-construction.com'
          msg['To']   = 'priscila@oakpark-construction.com'
          msg.set_content(
              "ads_pulse.yml failed on run ${{ github.run_id }}.\n\n"
              "Logs: https://github.com/priihigashi/oak-park-ai-hub/actions/runs/${{ github.run_id }}\n"
          )
          s = smtplib.SMTP_SSL('smtp.gmail.com', 465)
          s.login('priscila@oakpark-construction.com', os.environ['PRI_OP_GMAIL_APP_PASSWORD'])
          s.send_message(msg)
          s.quit()
          PYEOF
