name: Trecho público Canal UOL
on:
  push:
    branches: ['tmp/reel-dggic0xdy4z-20261124']
    paths: ['.github/workflows/tmp_ig_dl.yml']
permissions:
  contents: write
jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q -U yt-dlp
      - run: |
          yt-dlp -o '/tmp/original.%(ext)s' 'https://www.instagram.com/reel/DgGic0XDY4Z/'
          ffmpeg -loglevel error -ss 43.6 -i /tmp/original.* -t 6 -vf 'scale=360:-2' -c:v libx264 -pix_fmt yuv420p -crf 27 -c:a aac -movflags +faststart /tmp/clip.mp4
          base64 -w0 /tmp/clip.mp4 > ig_out/clip.b64
          git config user.name github-actions
          git config user.email actions@github.com
          git add ig_out/clip.b64
          git commit -m 'Trecho público de seis segundos para análise'
          git push
