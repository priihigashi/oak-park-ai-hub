name: tmp-ig-dl
on:
  push:
    branches: ['tmp/**']
    paths: ['.github/workflows/tmp_ig_dl.yml']
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      URL: "https://www.instagram.com/reel/DgHsQNEyr6-/"
      LANG_TX: "pt"
      TAG: "dolarvid"
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -U yt-dlp faster-whisper
      - name: baixar e transcrever
        run: |
          mkdir -p ig_out
          yt-dlp --write-info-json -o "ig_out/$TAG.%(ext)s" "$URL"
          python3 - <<'PY'
          import os, glob, json, subprocess
          from faster_whisper import WhisperModel
          tag = os.environ["TAG"]; lang = os.environ.get("LANG_TX") or None
          vid = [f for f in glob.glob(f"ig_out/{tag}.*") if not f.endswith(".json")][0]
          subprocess.run(["ffmpeg","-loglevel","error","-y","-i",vid,"-ac","1","-ar","16000","-f","s16le","ig_out/a.raw"],check=True)
          import numpy as np
          audio = np.fromfile("ig_out/a.raw", np.int16).astype(np.float32) / 32768.0; os.remove("ig_out/a.raw")
          segs, info = WhisperModel("small", compute_type="int8").transcribe(audio, language=lang, word_timestamps=True)
          with open(f"ig_out/{tag}_tx.txt", "w") as o:
              for s in segs:
                  o.write(f"[{s.start:6.1f}-{s.end:6.1f}] {s.text.strip()}\n")
                  for w in (s.words or []):
                      o.write(f"  w {w.start:6.2f} {w.end:6.2f} {w.word.strip()}\n")
          os.remove(f"ig_out/{tag}.info.json")
          PY
      - name: gravar resultado na branch
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add ig_out
          git commit -m "out $TAG"
          git pull --rebase || true
          git push
