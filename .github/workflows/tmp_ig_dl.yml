name: tmp-mulheres-render
on:
  push:
    branches: ['tmp/mulheres-2027-render']
    paths: ['.github/workflows/tmp_ig_dl.yml']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VOZ_GRATIS: pt-BR-ThalitaMultilingualNeural
      VOZ_RATE: "+8%"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q edge-tts playwright pillow yt-dlp faster-whisper num2words
      - run: python -m playwright install chromium --with-deps
      - name: original
        continue-on-error: true
        run: yt-dlp -o '/tmp/mulheres-original.%(ext)s' 'https://www.instagram.com/reel/DgKhfcwPQfx/'
      - name: renderer original e voz gratuita
        run: |
          cd mulheres-render
          python render.py
      - uses: actions/upload-artifact@v4
        with:
          name: mulheres-2027-previa
          path: mulheres-render/saida/
      - name: resultado
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add mulheres-render/saida/
          git commit -m 'Resultado previa Mulheres 2027 - voz gratuita'
          git push
