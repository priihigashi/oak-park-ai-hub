name: tmp_ig_dl
on:
  push:
    branches: [tmp/ig-opc-transicao]
    paths: ['.github/workflows/tmp_ig_dl.yml']
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -U yt-dlp faster-whisper
      - name: download
        run: |
          mkdir -p ig_out
          yt-dlp --write-info-json -o "ig_out/r2.%(ext)s" "https://www.instagram.com/reel/DdOVUbVBzSk/"
          ls -la ig_out
      - name: meta
        run: |
          python3 - <<'EOF'
          import json,glob
          f=glob.glob('ig_out/r2*.info.json')[0]
          d=json.load(open(f))
          keys=['uploader','uploader_id','channel','upload_date','timestamp','duration','title','description','track','artist','album','like_count','comment_count','view_count','width','height','fps']
          with open('ig_out/r2_meta.txt','w') as o:
            for k in keys: o.write(f"{k}: {d.get(k)}\n")
          EOF
          rm -f ig_out/*.info.json
      - name: transcribe
        run: |
          python3 - <<'EOF'
          import glob
          from faster_whisper import WhisperModel
          v=[x for x in glob.glob('ig_out/r2.*') if x.endswith(('.mp4','.webm','.mkv'))][0]
          m=WhisperModel('small',compute_type='int8')
          segs,info=m.transcribe(v)
          with open('ig_out/r2_tx.txt','w') as o:
            o.write(f"lang {info.language} {info.language_probability:.2f}\n")
            for s in segs: o.write(f"[{s.start:.1f}-{s.end:.1f}] {s.text}\n")
          EOF
      - name: frames
        run: |
          V=$(ls ig_out/r2.* | grep -E 'mp4|webm|mkv' | head -1)
          mkdir -p ig_out/r2_frames
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$V")
          python3 -c "import subprocess;d=float('$D');n=32
          for i in range(n):
            t=d*i/n
            subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',str(t),'-i','$V','-frames:v','1','-vf','scale=300:-1','ig_out/r2_frames/f%02d_%05.2f.jpg'%(i,t)])"
          ffmpeg -y -loglevel error -i "$V" -vn -acodec libmp3lame -q:a 4 ig_out/r2_audio.mp3
          ls -la ig_out ig_out/r2_frames
      - name: commit
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add ig_out
          git commit -m 'tmp ig_out r2'
          git push || (git pull --rebase && git push)
