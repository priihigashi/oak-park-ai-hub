name: tmp_ig_dl
on:
  push:
    branches: [tmp/ig-opc-transicao]
    paths: ['.github/workflows/tmp_ig_dl.yml']
permissions:
  contents: write
concurrency: tmp-ig-dl
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -U yt-dlp faster-whisper numpy
      - name: all
        run: |
          mkdir -p ig_out
          python3 - <<'PY'
          import json,glob,subprocess,os,numpy as np
          reels={'r1':'https://www.instagram.com/reel/DfM4j3lIm94/','r2':'https://www.instagram.com/reel/DdOVUbVBzSk/','r3':'https://www.instagram.com/reel/DeR2A6WSNNs/'}
          from faster_whisper import WhisperModel
          m=WhisperModel('small',compute_type='int8')
          for n,u in reels.items():
            try:
              subprocess.run(['yt-dlp','--write-info-json','-f','mp4/best','-o',f'ig_out/{n}.%(ext)s',u],check=True)
              d=json.load(open(glob.glob(f'ig_out/{n}*.info.json')[0]))
              with open(f'ig_out/{n}_meta.txt','w') as o:
                for k in ['uploader','uploader_id','channel','upload_date','duration','description','track','artist','album','like_count','view_count','width','height','fps']: o.write(f"{k}: {d.get(k)}\n")
              for f in glob.glob(f'ig_out/{n}*.info.json'): os.remove(f)
              v=[x for x in glob.glob(f'ig_out/{n}.*') if x.endswith(('.mp4','.webm','.mkv'))][0]
              raw=subprocess.run(['ffmpeg','-loglevel','error','-i',v,'-f','f32le','-ac','1','-ar','16000','-'],capture_output=True).stdout
              a=np.frombuffer(raw,np.float32)
              segs,info=m.transcribe(a)
              with open(f'ig_out/{n}_tx.txt','w') as o:
                o.write(f"lang {info.language} {info.language_probability:.2f}\n")
                for s in segs: o.write(f"[{s.start:.1f}-{s.end:.1f}] {s.text}\n")
              dur=float(subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',v],capture_output=True,text=True).stdout)
              os.makedirs(f'ig_out/{n}_frames',exist_ok=True)
              N=32
              for i in range(N):
                t=dur*i/N
                subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',str(t),'-i',v,'-frames:v','1','-vf','scale=300:-1',f'ig_out/{n}_frames/f{i:02d}_{t:05.2f}.jpg'])
              subprocess.run(['ffmpeg','-y','-loglevel','error','-i',v,'-vf','scale=540:-2','-c:v','libx264','-crf','28','-c:a','aac','-b:a','128k',f'ig_out/{n}_small.mp4'])
              if v!=f'ig_out/{n}_small.mp4': os.remove(v)
            except Exception as e:
              open(f'ig_out/{n}_ERROR.txt','w').write(repr(e))
          PY
          ls -laR ig_out | head -80
      - name: commit
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git pull --rebase || true
          git add ig_out
          git commit -m 'tmp ig_out r1-r3'
          git push || (git pull --rebase && git push)
