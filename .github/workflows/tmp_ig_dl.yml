name: tmp-ig-dl
on:
  push:
    branches: ['tmp/**']
    paths: ['.github/workflows/tmp_ig_dl.yml']
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LISTA: "r23 https://www.instagram.com/reel/DgQQ79Zy751/"
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -U yt-dlp faster-whisper
      - name: baixar e transcrever
        run: |
          mkdir -p ig_out
          python3 - <<'PY'
          import os, glob, json, subprocess, time
          import numpy as np
          from faster_whisper import WhisperModel
          model = WhisperModel("small", compute_type="int8")
          for item in os.environ["LISTA"].split(";"):
              tag, url = item.split()
              try:
                  ok=False
                  for u in [url, url.replace('/reel/','/p/')]:
                      for k in range(2):
                          r=subprocess.run(["yt-dlp","--write-info-json","-o",f"ig_out/{tag}.%(ext)s",u],capture_output=True,text=True)
                          if r.returncode==0: ok=True; break
                          err=r.stderr[-800:]; time.sleep(10)
                      if ok: break
                  if not ok: raise Exception(err)
                  vid = [f for f in glob.glob(f"ig_out/{tag}.*") if not f.endswith(".json")][0]
                  subprocess.run(["ffmpeg","-loglevel","error","-y","-i",vid,"-ac","1","-ar","16000","-f","s16le","ig_out/a.raw"],check=True)
                  audio = np.fromfile("ig_out/a.raw", np.int16).astype(np.float32) / 32768.0; os.remove("ig_out/a.raw")
                  segs, info = model.transcribe(audio, language="pt")
                  with open(f"ig_out/{tag}_tx.txt", "w") as o:
                      for s in segs:
                          o.write(f"[{s.start:6.1f}-{s.end:6.1f}] {s.text.strip()}\n")
                  meta = json.load(open(f"ig_out/{tag}.info.json"))
                  with open(f"ig_out/{tag}_meta.txt", "w") as o:
                      o.write(f"link: {url}\nautor: {meta.get('uploader')}\ndata_postagem: {meta.get('upload_date')}\nlegenda: {meta.get('description')}\n")
                  os.makedirs(f"ig_out/{tag}_frames",exist_ok=True)
                  d=float(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","csv=p=0",vid]).decode().strip() or 0)
                  for i in range(20):
                      subprocess.run(["ffmpeg","-loglevel","error","-y","-ss",str(d*(i+0.5)/20),"-i",vid,"-frames:v","1","-vf","scale=300:-1",f"ig_out/{tag}_frames/f{i:02d}.jpg"])  # quadros
                  os.remove(f"ig_out/{tag}.info.json"); os.remove(vid)
              except Exception as e:
                  open(f"ig_out/{tag}_FALHOU.txt","w").write(f"{url}\n{e}\n")
          PY
      - name: gravar resultado na branch
        if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add ig_out
          git commit -m "out lote" || true
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 5; done
