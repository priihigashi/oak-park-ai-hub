name: tmp_ig_dl
on:
  push:
    branches: ['tmp/bigtechs']
    paths: ['.github/workflows/tmp_ig_dl.yml']
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    env:
      URL: 'https://www.instagram.com/reel/DgA42bEPpcc/'
      N: 'r3'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -U yt-dlp faster-whisper numpy
      - name: download
        continue-on-error: true
        run: |
          mkdir -p ig_out
          yt-dlp -o "ig_out/$N.%(ext)s" "$URL" > ig_out/${N}_dllog.txt 2>&1 || true
      - name: transcribe
        continue-on-error: true
        run: |
          python - <<'EOF' >> ig_out/${N}_dllog.txt 2>&1
          import glob, os, subprocess, numpy as np
          from faster_whisper import WhisperModel
          n=os.environ['N']
          v=[f for f in glob.glob(f'ig_out/{n}.*') if not f.endswith(('.json','.txt'))][0]
          raw=subprocess.run(['ffmpeg','-i',v,'-f','s16le','-ac','1','-ar','16000','-'],capture_output=True).stdout
          audio=np.frombuffer(raw,np.int16).astype(np.float32)/32768.0
          m=WhisperModel('small',compute_type='int8')
          segs,_=m.transcribe(audio,language='pt')
          with open(f'ig_out/{n}_tx.txt','w') as f:
              for s in segs:
                  f.write(f'[{s.start:6.1f}-{s.end:6.1f}] {s.text.strip()}\n')
          dur=len(audio)/16000
          os.makedirs(f'ig_out/{n}_frames',exist_ok=True)
          k=20
          for i in range(k):
              t=dur*(i+0.5)/k
              subprocess.run(['ffmpeg','-y','-ss',str(t),'-i',v,'-frames:v','1','-vf','scale=300:-1',f'ig_out/{n}_frames/f{i:02d}_{t:05.1f}s.jpg'],check=False,capture_output=True)
          print('dur',dur)
          EOF
      - name: commit
        if: always()
        run: |
          rm -f ig_out/*.json ig_out/*.mp4 ig_out/*.webm ig_out/*.m4a ig_out/*.mkv
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add ig_out && git commit -m 'ig_out r3' || exit 0
          git push || (git pull --rebase && git push)
