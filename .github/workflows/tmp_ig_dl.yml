name: tmp-ig-dl
on:
  push:
    branches: ['tmp/**']
    paths: ['.github/workflows/tmp_ig_dl.yml']
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      URLS: "r1|https://www.instagram.com/reel/Dfoy-ortL-a/ r2|https://www.instagram.com/reel/DPzOLc4Du3E/ r3|https://www.instagram.com/p/Df2-3mKGjVR/"
      LANG_TX: "pt"
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -U yt-dlp faster-whisper
      - name: baixar e transcrever
        run: |
          mkdir -p ig_out
          python3 - <<'PY'
          import os, glob, json, subprocess
          import numpy as np
          from faster_whisper import WhisperModel
          model = WhisperModel("small", compute_type="int8")
          for par in os.environ["URLS"].split():
              tag, url = par.split("|", 1)
              r = subprocess.run(["yt-dlp", "--write-info-json", "-o", f"ig_out/{tag}.%(ext)s", url], capture_output=True, text=True)
              open(f"ig_out/{tag}_log.txt", "w").write(r.stdout[-2000:] + r.stderr[-3000:])
              infos = glob.glob(f"ig_out/{tag}*.info.json")
              meta = json.load(open(infos[0])) if infos else {}
              with open(f"ig_out/{tag}_meta.txt", "w") as o:
                  o.write(f"link: {url}\nautor: {meta.get('uploader')}\ndata_postagem: {meta.get('upload_date')}\nlegenda: {meta.get('description')}\n")
              for f in infos: os.remove(f)
              vids = [f for f in glob.glob(f"ig_out/{tag}*") if f.endswith((".mp4", ".webm", ".mkv"))]
              if not vids: continue
              vid = vids[0]
              try:
                  subprocess.run(["ffmpeg","-loglevel","error","-y","-i",vid,"-ac","1","-ar","16000","-f","s16le","ig_out/a.raw"],check=True)
                  audio = np.fromfile("ig_out/a.raw", np.int16).astype(np.float32) / 32768.0; os.remove("ig_out/a.raw")
                  segs, info = model.transcribe(audio, language=os.environ.get("LANG_TX") or None)
                  with open(f"ig_out/{tag}_tx.txt", "w") as o:
                      for s in segs: o.write(f"[{s.start:6.1f}-{s.end:6.1f}] {s.text.strip()}\n")
              except Exception as ex:
                  open(f"ig_out/{tag}_tx.txt","w").write("erro: " + str(ex))
              dur = float(meta.get("duration") or 30)
              os.makedirs(f"ig_out/{tag}_frames", exist_ok=True)
              for i in range(16):
                  subprocess.run(["ffmpeg","-loglevel","error","-ss",str(dur*(i+0.5)/16),"-i",vid,"-frames:v","1","-vf","scale=300:-1",f"ig_out/{tag}_frames/{i:02d}.jpg"])
              if tag == "r1":
                  subprocess.run(["ffmpeg","-loglevel","error","-y","-i",vid,"-vf","scale=720:-2","-c:v","libx264","-crf","26","-preset","veryfast","-c:a","aac","-b:a","96k",f"ig_out/{tag}_clip.mp4"])
              os.remove(vid)
          PY
      - name: gravar resultado na branch
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -f ig_out
          git commit -m "out $TAG"
          git pull --rebase || true
          git push
