name: tmp ig dl
on:
  push:
    branches: [tmp/tomate-tx]
    paths: [".github/workflows/tmp_ig_dl.yml"]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
        with: {ref: tmp/tomate-tx}
      - uses: actions/setup-python@v5.6.0
        with: {python-version: "3.11"}
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: pip install -q -U yt-dlp faster-whisper
      - name: dl
        run: |
          mkdir -p ig_out
          yt-dlp -q --no-warnings --write-info-json -o "ig_out/r8.%(ext)s" https://www.instagram.com/reel/Dff1VJXp99h/ || echo fail
      - name: tx
        run: |
          python - <<'PY'
          import os, subprocess
          from faster_whisper import WhisperModel
          m = WhisperModel("small", device="cpu", compute_type="int8")
          f = "ig_out/r8.mp4"
          if os.path.exists(f):
              b = f[:-4]
              segs, _ = m.transcribe(f, language="pt", word_timestamps=True)
              out = [[round(s.start,2), round(s.end,2), s.text.strip()] for s in segs]
              open(b + "_tx.txt", "w").write("\n".join(f"[{a}-{e}] {t}" for a, e, t in out))
              dur = float(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","csv=p=0",f]).decode().strip() or 0)
              os.makedirs(b + "_frames", exist_ok=True)
              for k in range(16):
                  t = dur*(k+0.5)/16
                  subprocess.run(["ffmpeg","-v","error","-y","-ss",str(t),"-i",f,"-frames:v","1","-vf","scale=300:-2",f"{b}_frames/f{k:02d}.jpg"])
          PY
          [ -f ig_out/r8.info.json ] && python -c "import json;d=json.load(open('ig_out/r8.info.json'));print(d.get('uploader'),d.get('uploader_id'),d.get('channel'),d.get('upload_date'));print((d.get('description') or '')[:2000])" > ig_out/r8_meta.txt
          rm -f ig_out/*.info.json
      - name: commit
        run: |
          git config user.name "tomate-bot"; git config user.email "bot@example.com"
          git add ig_out && git commit -m "ig ref8 output" && (git push origin HEAD:tmp/tomate-tx || (git pull --rebase -X theirs origin tmp/tomate-tx && git push origin HEAD:tmp/tomate-tx))
