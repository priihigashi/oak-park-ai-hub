name: tmp-ig-dl
on:
  push:
    branches: ['tmp/**']
    paths: ['.github/workflows/tmp_ig_dl.yml']
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      URL: "https://www.instagram.com/reel/DgG__NlPB-2/"
      LANG_TX: "pt"
      TAG: "r1"
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -U yt-dlp faster-whisper
      - name: baixar e transcrever
        run: |
          mkdir -p ig_out
          yt-dlp --write-info-json -o "ig_out/$TAG.%(ext)s" "$URL"
          python3 - <<'PY'
          import os, glob, json, subprocess
          from faster_whisper import WhisperModel
          tag = os.environ["TAG"]; lang = os.environ.get("LANG_TX") or None
          vid = [f for f in glob.glob(f"ig_out/{tag}.*") if not f.endswith(".json")][0]
          # áudio vira PCM 16 kHz antes: o faster-whisper novo quebra ao abrir o vídeo direto (av.open metadata_errors, 23/11)
          subprocess.run(["ffmpeg","-loglevel","error","-y","-i",vid,"-ac","1","-ar","16000","-f","s16le","ig_out/a.raw"],check=True)
          import numpy as np
          audio = np.fromfile("ig_out/a.raw", np.int16).astype(np.float32) / 32768.0; os.remove("ig_out/a.raw")
          segs, info = WhisperModel("small", compute_type="int8").transcribe(audio, language=lang)
          with open(f"ig_out/{tag}_tx.txt", "w") as o:
              for s in segs:
                  o.write(f"[{s.start:6.1f}-{s.end:6.1f}] {s.text.strip()}\n")
          meta = json.load(open(f"ig_out/{tag}.info.json"))
          with open(f"ig_out/{tag}_meta.txt", "w") as o:
              o.write(f"link: {os.environ['URL']}\nautor: {meta.get('uploader')}\ndata_postagem: {meta.get('upload_date')}\nidioma: {info.language}\nlegenda: {meta.get('description')}\n")
          os.makedirs(f"ig_out/{tag}_frames", exist_ok=True)
          dur = float(meta.get("duration") or 30)
          for i in range(16):
              subprocess.run(["ffmpeg", "-loglevel", "error", "-ss", str(dur * (i + 0.5) / 16), "-i", vid, "-frames:v", "1", "-vf", "scale=300:-1", f"ig_out/{tag}_frames/{i:02d}.jpg"])
          os.remove(f"ig_out/{tag}.info.json"); os.remove(vid)
          PY
      - name: gravar resultado na branch
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add ig_out
          git commit -m "out $TAG"
          git pull --rebase || true
          git push
