name: OPC paint idea acceptance (owner-triggered)
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'scripts/factcheck_print/opc*'
      - 'tests/test_opc_print*'
      - '.github/workflows/opc_paint_acceptance.yml'
permissions:
  contents: read
  issues: write
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: pip install requests pillow
      - run: python -m unittest discover -s tests -p 'test_opc_print*.py' -v
  authorized-paint-test:
    needs: regression
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'opc-paint-final-20260920' &&
      github.event.pull_request.number == 300 &&
      github.actor == 'priihigashi' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/opc-print-ready-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: opc-print-filing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install existing OPC runtime dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          pip install yt-dlp openai anthropic google-generativeai faster-whisper gspread google-auth google-api-python-client python-dotenv requests youtube-transcript-api instaloader pytubefix playwright pillow
          python -m playwright install chromium --with-deps
      - name: One authorized idea-mode run; five images maximum; private outputs only
        env:
          CLAUDE_KEY_OPC: ${{ secrets.CLAUDE_KEY_OPC }}
          PRI_OP_REPLICATE_API_KEY: ${{ secrets.PRI_OP_REPLICATE_API_KEY }}
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
          PRI_OP_GMAIL_APP_PASSWORD: ${{ secrets.PRI_OP_GMAIL_APP_PASSWORD }}
        run: |
          python scripts/factcheck_print/opc.py \
            --project opc --engine claude \
            --image-model google/nano-banana-pro \
            --rebuild-row 429 \
            --idea 'Why your paint color looks different at home' \
            --notes 'OWNER REVIEW FINAL. Prefer exactly five cards with five distinct visual jobs. Fold the lamp/artificial-light point into Card 2 lighting comparison instead of giving it a repetitive standalone card. Card 1: keep a contemporary South Florida room but furnishings must look current/well-kept, not worn. Card 2 is the main teaching visual: controlled same neutral wall/room, same camera position, visibly different sunny daylight vs overcast daylight vs evening artificial light; conceptual, no exact brand color claim. Card 3 artificial lamp/room-lighting detail is supporting, not a near-duplicate hero. Card 4 matte vs higher-sheen reflectivity comparison is a strong keep. Card 5 show the real sampling PROCESS (foam board/brush or movable sample method) without presenting an AI-created swatch as an exact paint color. Card 6 must have its own distinct closing/checklist composition, not reuse Card 5. No consecutive duplicate visual keys unless a controlled comparison requires it. Use primary manufacturer guidance from Benjamin Moore and Sherwin-Williams; no contractor competitor sources, invented prices, promises, first-person project claims, brand shade names/codes, or fake before/after. Public carousel/caption must not add loud AI boilerplate; internal provenance remains in cards.json. Idea mode: no source video/transcription claim.' \
            --out opc-paint-final --run-key pr300-paint-final-20260920
  authorized-editorial-resume:
    needs: regression
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'opc-paint-resume-20260920' &&
      github.event.pull_request.number == 300 &&
      github.actor == 'priihigashi' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/opc-print-ready-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: opc-print-filing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install existing OPC runtime dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          pip install yt-dlp openai anthropic google-generativeai faster-whisper gspread google-auth google-api-python-client python-dotenv requests youtube-transcript-api instaloader pytubefix playwright pillow
          python -m playwright install chromium --with-deps
      - name: Resume saved evidence and draft; never replay capture or research
        env:
          CLAUDE_KEY_OPC: ${{ secrets.CLAUDE_KEY_OPC }}
          PRI_OP_REPLICATE_API_KEY: ${{ secrets.PRI_OP_REPLICATE_API_KEY }}
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
          PRI_OP_GMAIL_APP_PASSWORD: ${{ secrets.PRI_OP_GMAIL_APP_PASSWORD }}
        run: |
          python scripts/factcheck_print/opc_resume_editorial.py \
            --folder-id 1T_2e8JHybyo7Qd59xW_v2_6SsIU44ZAo \
            --run-key pr300-paint-idea-20260920
  authorized-assisted-media:
    needs: regression
    if: >-
