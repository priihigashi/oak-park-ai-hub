          import json
          print(json.load(open('opc_result.json')).get('review_url',''))
          PY
          )"
          test -n "$REVIEW_URL"
          gh pr comment 300 --body "OPC private review ready: $REVIEW_URL"
      - name: Remove reusable queue label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/issues/300/labels/opc-chat-queue" >/dev/null 2>&1 || true

