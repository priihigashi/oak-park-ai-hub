          PRI_OP_IG_COOKIES: ${{ secrets.PRI_OP_IG_COOKIES }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
        run: python scripts/factcheck_print/opc_chat_queue.py --mode link
      - name: Return review site on PR
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REVIEW_URL="$(python - <<'PY'
          import json
          print(json.load(open('opc_result.json')).get('review_url',''))
          PY
          )"
          test -n "$REVIEW_URL"
          gh pr comment 300 --body "OPC private video-derived review ready: $REVIEW_URL"$'\n\n'"Built, NOT approved or published."
      - name: Remove reusable queue label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/issues/300/labels/opc-link-queue" >/dev/null 2>&1 || true
