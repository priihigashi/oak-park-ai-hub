    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: opc-print-filing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install existing OPC runtime dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          pip install yt-dlp openai anthropic google-generativeai faster-whisper gspread google-auth google-api-python-client python-dotenv requests youtube-transcript-api instaloader pytubefix playwright pillow
          python -m playwright install chromium --with-deps
      - name: Assisted media and filing test; no text API calls
        env:
          PRI_OP_REPLICATE_API_KEY: ${{ secrets.PRI_OP_REPLICATE_API_KEY }}
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
          PRI_OP_GMAIL_APP_PASSWORD: ${{ secrets.PRI_OP_GMAIL_APP_PASSWORD }}
        run: |
          python scripts/factcheck_print/opc_assisted_acceptance.py \
            --folder-id 1T_2e8JHybyo7Qd59xW_v2_6SsIU44ZAo \
            --run-key pr300-paint-idea-20260920 \
            --spec-sha256 ff1d8eb2ea6ff25916e731a1fc69392728308de3728b407f121c824cc50b2bd7

