name: tmp-transcribe-nordeste
on:
  push:
    branches: [tmp-transcribe-nordeste]
    paths: ['tmp/tr/audio.ogg']
permissions:
  contents: write
jobs:
  tr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: tmp-transcribe-nordeste}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q faster-whisper numpy
      - run: |
          python3 - <<'PY'
          import subprocess,numpy as np
          from faster_whisper import WhisperModel
          raw=subprocess.run(["ffmpeg","-nostdin","-v","error","-i","tmp/tr/audio.ogg","-ac","1","-ar","16000","-f","s16le","-"],capture_output=True).stdout
          A=np.frombuffer(raw,np.int16).astype(np.float32)/32768
          m=WhisperModel("medium",device="cpu",compute_type="int8")
          segs,_=m.transcribe(A,language="pt",vad_filter=True)
          open("tmp/tr/transcript.txt","w").write("\n".join(f"[{s.start:5.1f}] {s.text.strip()}" for s in segs))
          PY
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add tmp/tr/transcript.txt && git commit -m "tmp: transcript" && git push origin tmp-transcribe-nordeste
