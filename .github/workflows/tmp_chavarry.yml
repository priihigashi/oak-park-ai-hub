name: tmp-chavarry
on:
  push:
    branches: [tmp-chavarry]
    paths: ['job/**', '.github/workflows/tmp_chavarry.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q edge-tts yt-dlp "rembg[cpu]" onnxruntime pillow requests beautifulsoup4 faster-whisper google-api-python-client google-auth
      - env:
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
        run: python job/run.py || true
      - run: |
          git config user.name tmp-bot && git config user.email tmp-bot@users.noreply.github.com
          git add out && git commit -m "out" && git push || echo nothing
