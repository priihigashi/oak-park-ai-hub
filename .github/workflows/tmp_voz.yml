name: tmp-voz
on:
  push:
    branches: ['tmp/**']
    paths: ['voz/fala.json', '.github/workflows/tmp_voz.yml']
permissions:
  contents: write
jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: voz gratis
        run: |
          pip install -q edge-tts
          python3 - <<'PY'
          import asyncio, json, edge_tts
          VOZ = "pt-BR-ThalitaMultilingualNeural"
          fala = json.load(open("voz/fala.json"))
          async def um(cid, txt):
              c = edge_tts.Communicate(txt, VOZ, rate="+6%", boundary="WordBoundary")
              palavras = []
              with open(f"voz/{cid}.mp3", "wb") as f:
                  async for ch in c.stream():
                      if ch["type"] == "audio":
                          f.write(ch["data"])
                      elif ch["type"] == "WordBoundary":
                          palavras.append({"t": ch["offset"] / 1e7, "d": ch["duration"] / 1e7, "w": ch["text"]})
              json.dump(palavras, open(f"voz/{cid}.json", "w"), ensure_ascii=False)
          async def main():
              for cid, txt in fala:
                  await um(cid, txt)
          asyncio.run(main())
          PY
          ls -la voz
      - name: gravar
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add voz
          git commit -m "voz gerada"
          git pull --rebase || true
          git push
