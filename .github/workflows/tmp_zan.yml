name: tmp_zan
on:
  push:
    branches: [tmp/pavinatto-erika]
    paths: ['.github/workflows/tmp_zan.yml','job/zanatta.py']
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q "rembg[cpu]" pillow requests
      - run: python job/zanatta.py
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add job_out; git commit -m zan || exit 0
          git pull --rebase; git push
