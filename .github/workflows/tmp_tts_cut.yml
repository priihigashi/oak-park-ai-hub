name: tmp_tts_cut
on:
  push:
    branches: [tmp/pavinatto-erika]
    paths: ['.github/workflows/tmp_tts_cut.yml','job/lines.json']
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: sudo apt-get install -y -qq ffmpeg
      - run: pip install -q edge-tts "rembg[cpu]" pillow
      - run: python job/tts.py
      - run: python job/cut.py
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add job_out; git commit -m job_out || exit 0
          git pull --rebase; git push
