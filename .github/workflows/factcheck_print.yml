name: Fact-check PRINT deck (claim card + article screenshot card)

# ─── HOW TO USE (phone or computer) ───────────────────────────────────────
# A) GitHub app / browser → oak-park-ai-hub → Actions → "Fact-check PRINT deck" → Run workflow → paste the video link.
# B) Owner issue: factcheck: <video link> for News, opc-print: <video link or idea> for OPC.
# C) Claude Code / Codex / any agent with the gh CLI:
#      gh workflow run factcheck_print.yml -R priihigashi/oak-park-ai-hub -f project=opc -f url='<link>'
# OPC output is a short visual feed plus a separate private PRINT evidence/review pack.
# No approval, scheduling, publication or automatic merge occurs here.
# ──────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Video link (Instagram, TikTok or YouTube)"
        required: false
        type: string
      notes:
        description: "Optional extra context / what to focus on"
        required: false
        default: ""
        type: string
      project:
        description: "Niche folder for the output (brazil = News/Brazil/Carousel)"
        required: false
        default: "brazil"
        type: choice
        options: [brazil, usa, opc]
      engine:
        description: "Research engine. OPC auto selects an available credential, never silently retries a paid call."
        required: false
        default: "auto"
        type: choice
        options: [auto, claude, openai]
      idea:
        description: "OPC: topic text instead of a video"
        required: false
        type: string
      discover:
        description: "OPC: find an idea from existing boards"
        default: false
        type: boolean
      image_model:
        description: "OPC image model (no silent model fallback)"
        default: "google/nano-banana-pro"
        type: choice
        options: [google/nano-banana-pro, google/imagen-4, bytedance/seedream-4.5]
      static_only:
        description: "OPC: explicitly request static delivery"
        default: false
        type: boolean
      rebuild_row:
        description: "Explicit existing OPC row to rebuild; blank blocks duplicates"
        required: false
        type: string
  issues:
    types: [opened]

concurrency:
  group: ${{ (inputs.project == 'opc' || startsWith(github.event.issue.title, 'opc-print:')) && 'opc-print-filing' || format('factcheck-print-{0}', github.event.issue.number || github.run_id) }}
  cancel-in-progress: false

jobs:
  factcheck:
    # Public issue entrypoint is owner-only to protect API budgets.
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.user.login == 'priihigashi' && (startsWith(github.event.issue.title, 'factcheck:') || startsWith(github.event.issue.title, 'opc-print:')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install system + python deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          pip install yt-dlp openai anthropic google-generativeai faster-whisper gspread google-auth google-api-python-client \
                      python-dotenv requests youtube-transcript-api instaloader pytubefix playwright pillow
          python -m playwright install chromium --with-deps
      - name: Resolve inputs (data, never shell source)
        env:
          EVT: ${{ github.event_name }}
          IN_URL: ${{ inputs.url }}
          IN_NOTES: ${{ inputs.notes }}
          IN_PROJECT: ${{ inputs.project }}
          IN_ENGINE: ${{ inputs.engine }}
          IN_IDEA: ${{ inputs.idea }}
          IN_DISCOVER: ${{ inputs.discover }}
          IN_IMAGE_MODEL: ${{ inputs.image_model }}
          IN_STATIC_ONLY: ${{ inputs.static_only }}
          IN_REBUILD_ROW: ${{ inputs.rebuild_row }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/factcheck_print/resolve_inputs.py
      - name: 1. Capture News (OPC uses helper-only capture without filing)
        if: env.FC_PROJECT != 'opc'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_KEY_4_CONTENT: ${{ secrets.CLAUDE_KEY_NEWS }}
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.PRI_OP_SUPADATA_API_KEY || secrets.SUPADATA_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRI_OP_GMAIL_APP_PASSWORD: ${{ secrets.PRI_OP_GMAIL_APP_PASSWORD }}
          PRI_OP_YT_COOKIES: ${{ secrets.PRI_OP_YT_COOKIES }}
          PRI_OP_IG_COOKIES: ${{ secrets.PRI_OP_IG_COOKIES }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/capture/capture_pipeline.py "$FC_URL" --project "$FC_PROJECT" --transcribe-only --notes="$(cat "$FC_NOTES_FILE")"
      - name: 2. Research, screenshots, deck, PNGs, Drive, email
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_KEY_OPC: ${{ secrets.CLAUDE_KEY_OPC }}
          PRI_OP_REPLICATE_API_KEY: ${{ secrets.PRI_OP_REPLICATE_API_KEY }}
          CLAUDE_KEY_PROJECT: ${{ env.FC_PROJECT != 'opc' && secrets.CLAUDE_KEY_NEWS || '' }}
          CLAUDE_KEY_4_CONTENT: ${{ secrets.CLAUDE_KEY_NEWS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
          PRI_OP_GMAIL_APP_PASSWORD: ${{ secrets.PRI_OP_GMAIL_APP_PASSWORD }}
          PRI_OP_YT_COOKIES: ${{ secrets.PRI_OP_YT_COOKIES }}
          PRI_OP_IG_COOKIES: ${{ secrets.PRI_OP_IG_COOKIES }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
        run: |
          set -euo pipefail
          if [ "$FC_PROJECT" = "opc" ]; then
            python scripts/factcheck_print/opc.py --project opc --out factcheck_out
          else
            python scripts/factcheck_print/run.py --url "$FC_URL" --project "$FC_PROJECT" --notes-file "$FC_NOTES_FILE" --out factcheck_out
          fi
      # OPC private evidence/media never enters public GitHub artifacts.
      - name: Fallback copy of the cards if the News run failed (3 days)
        if: failure() && env.FC_PROJECT != 'opc'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: factcheck-${{ github.run_id }}
          path: |
            factcheck_out/cards.json
            factcheck_out/png/
          retention-days: 3
          if-no-files-found: ignore
      - name: Comment on the issue (issue trigger only)
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          REVIEW_URL=""
          if [ "$FC_PROJECT" = "opc" ] && [ -f opc_result.json ]; then
            REVIEW_URL="$(python - <<'PY'
          import json
          try:
              print(json.load(open('opc_result.json')).get('review_url',''))
          except Exception:
              print('')
          PY
          )"
          fi
          if [ -n "$REVIEW_URL" ]; then
            gh issue comment "${{ github.event.issue.number }}" --body "OPC review ready: $REVIEW_URL\n\nStatus: built, NOT approved or published. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            gh issue comment "${{ github.event.issue.number }}" --body "Content run finished: $STATUS. No ready review URL was produced; inspect the run/private receipt. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
      - name: Failure email
        if: failure()
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: priscila@oakpark-construction.com
          password: ${{ secrets.PRI_OP_GMAIL_APP_PASSWORD }}
          to: priscila@oakpark-construction.com
          from: Oak Park AI <priscila@oakpark-construction.com>
          subject: "FACT-CHECK PRINT FAILED"
          body: |
            The fact-check deck run failed.
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
