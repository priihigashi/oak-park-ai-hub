name: tmp-assaltante-teatro
on:
  push:
    branches: [tmp-assaltante-teatro]
    paths: ['tmp_job/go.txt']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: tmp-assaltante-teatro }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper "rembg[cpu]" mediapipe==0.10.14 pillow numpy
      - name: run
        working-directory: tmp_job
        run: python job.py
      - name: commit
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add tmp_job/out
          git commit -m "out" || true
          git push
