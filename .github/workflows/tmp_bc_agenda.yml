name: tmp-bc-agenda
on:
  push:
    branches: ["tmp/cid-gomes-juros"]
    paths: [".github/workflows/tmp_bc_agenda.yml", "tools/bc_agenda.py"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/cid-gomes-juros
      - run: pip install playwright requests && python -m playwright install --with-deps chromium
      - run: python tools/bc_agenda.py
      - name: commit
        run: |
          git config user.name priihigashi
          git config user.email mcfollingproperties@gmail.com
          git add bc_out
          git commit -m "bc_out" || exit 0
          git push || (git pull --rebase && git push)
