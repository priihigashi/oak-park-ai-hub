name: tts-alerta-onibus
on:
  push:
    branches: ['media/ajude-votar-2026-10-25']
    paths: ['media-share/2026-10-25-alerta-onibus/tts/job.json']
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          T=media-share/2026-10-25-alerta-onibus/tts
          pip install -q -U edge-tts
          python3 $T/tts.py $T/job.json $T/out > $T/err.txt 2>&1 || echo FAIL >> $T/err.txt
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add $T; git commit -m "tts out" && git pull --rebase -q && git push
