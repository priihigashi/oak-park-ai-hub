name: Sala Escura yt (temporary, branch-only)

# Temporary: downloads the URLs in sala_escura/yt.json with yt-dlp on push to this branch.
on:
  push:
    branches: [claude/sala-escura]
    paths: ['sala_escura/yt.json']

permissions:
  contents: write

jobs:
  dl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download
        env:
          YT_COOKIES: ${{ secrets.PRI_OP_YT_COOKIES }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -U yt-dlp
          mkdir -p out
          printf '%s' "$YT_COOKIES" > /tmp/cookies.txt
          python3 - <<'PY'
          import json, subprocess
          items = json.load(open('sala_escura/yt.json'))
          log = []
          for it in items:
              cmd = ['yt-dlp', '--cookies', '/tmp/cookies.txt', '-f', 'bv*[height<=1080][ext=mp4]+ba[ext=m4a]/b[height<=1080]',
                     '--merge-output-format', 'mp4', '-o', f"out/{it['name']}.%(ext)s", '--no-playlist', '--write-info-json']
              if it.get('section'): cmd += ['--download-sections', it['section']]
              r = subprocess.run(cmd + [it['url']], capture_output=True, text=True)
              log.append({'name': it['name'], 'rc': r.returncode, 'err': r.stderr[-800:]})
          json.dump(log, open('out/log.json', 'w'), indent=1)
          PY
          rm -f /tmp/cookies.txt
          ls -la out
      - name: Transcribe audio (faster-whisper)
        continue-on-error: true
        run: |
          pip install -q faster-whisper > out/pip.log 2>&1 || true
          cat > /tmp/tr.py <<'PY'
          import json, glob, os, traceback
          res = {}
          try:
              from faster_whisper import WhisperModel
              m = WhisperModel("small", device="cpu", compute_type="int8")
              for f in sorted(glob.glob('sala_escura/audio/*.mp3')) + sorted(glob.glob('out/*.mp4')):
                  try:
                      import subprocess, numpy as np
                      raw = subprocess.run(['ffmpeg', '-v', 'error', '-i', f, '-ac', '1', '-ar', '16000', '-f', 's16le', '-'], capture_output=True).stdout
                      audio = np.frombuffer(raw, np.int16).astype(np.float32) / 32768.0
                      segs, info = m.transcribe(audio, language=('pt' if 'athena' in f else None), word_timestamps=True)
                      res[os.path.basename(f)] = {"language": info.language, "segments": [{"start": round(x.start, 2), "end": round(x.end, 2), "text": x.text.strip(), "words": [[round(w.start,2), round(w.end,2), w.word] for w in (x.words or [])]} for x in segs]}
                  except Exception:
                      res[os.path.basename(f)] = {"error": traceback.format_exc()}
          except Exception:
              res["_fatal"] = traceback.format_exc()
          json.dump(res, open('out/transcripts.json', 'w'), ensure_ascii=False, indent=1)
          PY
          python3 /tmp/tr.py > out/tr.log 2>&1 || true
      - name: Separate vocals (demucs)
        continue-on-error: true
        run: |
          if [ -f sala_escura/audio/sam_hq.wav ]; then
            pip install -q demucs soundfile > out/demucs_pip.log 2>&1 || true
            python3 -m demucs --two-stems=vocals -n htdemucs -o /tmp/sep sala_escura/audio/sam_hq.wav > out/demucs.log 2>&1 || true
            cp /tmp/sep/htdemucs/sam_hq/vocals.wav out/sam_vocals.wav 2>/dev/null || true
            cp /tmp/sep/htdemucs/sam_hq/no_vocals.wav out/sam_music.wav 2>/dev/null || true
            ls -la out
          fi
      - name: Voice lines (edge-tts)
        continue-on-error: true
        run: |
          if [ -f sala_escura/voice_lines.json ]; then
            pip install -q edge-tts > out/edge_pip.log 2>&1 || true
            python3 - <<'PY'
          import json, subprocess
          for it in json.load(open('sala_escura/voice_lines.json')):
              cmd = ['edge-tts', '--voice', it['voice'], '--text', it['text'], '--write-media', f"out/{it['name']}.mp3"]
              if it.get('rate'): cmd += ['--rate=' + it['rate']]
              if it.get('pitch'): cmd += ['--pitch', it['pitch']]
              r = subprocess.run(cmd, capture_output=True, text=True)
              open('out/edge.log','a').write(f"{it['name']} rc={r.returncode} {r.stderr[-600:]}\n")
          PY
            ls -la out
          fi
      - name: HeyGen voices / TTS
        continue-on-error: true
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: |
          if [ -f sala_escura/heygen.json ]; then
          cat > /tmp/hg.py <<'PY'
          import os, json, requests
          K = os.environ['HEYGEN_API_KEY']; H = {'X-Api-Key': K, 'Accept': 'application/json'}
          cfg = json.load(open('sala_escura/heygen.json'))
          log = {}
          r = requests.get('https://api.heygen.com/v2/voices', headers=H, timeout=60)
          log['voices_status'] = r.status_code
          try:
              vs = r.json().get('data', {}).get('voices', [])
          except Exception:
              vs = []; log['voices_raw'] = r.text[:500]
          keep = [v for v in vs if any(k in (v.get('name','') + v.get('language','')).lower() for k in cfg.get('voice_filter', []))]
          json.dump(keep, open('out/heygen_voices.json', 'w'), ensure_ascii=False, indent=1)
          log['n_voices'] = len(vs); log['n_kept'] = len(keep)
          for ep in ['https://api.heygen.com/v2/user/me', 'https://api.heygen.com/v2/user/remaining_quota', 'https://api.heygen.com/v1/user/remaining_quota']:
              try:
                  q = requests.get(ep, headers=H, timeout=60); log[ep] = {'status': q.status_code, 'body': q.text[:700]}
              except Exception as e:
                  log[ep] = str(e)
          for it in cfg.get('tts', []):
              body = {'voice_id': it['voice_id'], 'text': it['text']}
              body.update(it.get('extra', {}))
              rr = requests.post('https://api.heygen.com/v1/audio/text_to_speech', headers={**H, 'Content-Type': 'application/json'}, json=body, timeout=120)
              entry = {'status': rr.status_code, 'body': rr.text[:600]}
              try:
                  url = rr.json().get('data', {}).get('audio_url')
                  if url:
                      open(f"out/{it['name']}.mp3", 'wb').write(requests.get(url, timeout=120).content); entry['saved'] = True
              except Exception as e:
                  entry['err'] = str(e)
              log[it['name']] = entry
          json.dump(log, open('out/heygen_log.json', 'w'), indent=1)
          PY
          python3 /tmp/hg.py > out/heygen_run.log 2>&1 || true
          fi
      - name: ElevenLabs
        continue-on-error: true
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -f sala_escura/eleven.json ]; then
          cat > /tmp/el.py <<'PY'
          import os, json, requests
          K = os.environ['ELEVENLABS_API_KEY']; H = {'xi-api-key': K}
          cfg = json.load(open('sala_escura/eleven.json')); log = {}
          r = requests.get('https://api.elevenlabs.io/v1/user/subscription', headers=H, timeout=60)
          try:
              d = r.json(); log['subscription'] = {k: d.get(k) for k in ['tier','character_count','character_limit','can_use_instant_voice_cloning','status','next_character_count_reset_unix']}
          except Exception:
              log['subscription'] = r.text[:300]
          for it in cfg.get('tts', []):
              body = {'text': it['text'], 'model_id': it.get('model', 'eleven_v3')}
              if it.get('settings'): body['voice_settings'] = it['settings']
              rr = requests.post(f"https://api.elevenlabs.io/v1/text-to-speech/{it['voice_id']}?output_format=mp3_44100_128", headers={**H, 'Content-Type': 'application/json'}, json=body, timeout=180)
              if rr.status_code == 200:
                  open(f"out/{it['name']}.mp3", 'wb').write(rr.content); log[it['name']] = 'ok'
              else:
                  log[it['name']] = f"{rr.status_code} {rr.text[:300]}"
          json.dump(log, open('out/eleven_log.json', 'w'), indent=1, ensure_ascii=False)
          PY
          python3 /tmp/el.py > out/eleven_run.log 2>&1 || true
          fi
      - name: Push outputs
        if: always()
        run: |
          cd out
          git init -q -b tmp-salaescura-yt
          git config user.name "sala-escura"; git config user.email "actions@github.com"
          git add -A; git commit -qm "yt outputs (temporary)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tmp-salaescura-yt
