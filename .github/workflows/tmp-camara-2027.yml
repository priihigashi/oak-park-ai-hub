name: tmp-camara-2027
on:
  push:
    branches: [tmp-camara-2027]
    paths: ['narr.json','imgs.py','cut.py','tts.py','go.txt','adri.py']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q edge-tts requests pillow "rembg[cpu]"
      - run: mkdir -p out && python tts.py "$(cat voice.txt 2>/dev/null || echo pt-BR-ThalitaMultilingualNeural)"
      - run: python imgs.py
        if: ${{ !contains(github.event.head_commit.message, 'tts-only') }}
      - run: python cut.py
        if: ${{ !contains(github.event.head_commit.message, 'tts-only') }}
      - run: python adri.py || true
      - run: |
          git config user.name "Priih"; git config user.email "priihigashi@users.noreply.github.com"
          git add out && git commit -m "out [skip ci]" && git push
