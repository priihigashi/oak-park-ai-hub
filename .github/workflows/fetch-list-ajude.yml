name: fetch-list-ajude-votar
on:
  push:
    branches: ['media/ajude-votar-2026-10-25']
    paths: ['media-share/2026-10-25-alerta-onibus/fetch.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        env:
          IGC: ${{ secrets.PRI_OP_IG_COOKIES }}
        run: |
          pip install -q yt-dlp
          D=media-share/2026-10-25-alerta-onibus
          printf '%s' "$IGC" > /tmp/ig.txt
          if ! grep -q "instagram" /tmp/ig.txt; then echo "$IGC" | base64 -d > /tmp/ig.txt 2>/dev/null || true; fi
          mkdir -p $D/got
          while IFS='|' read -r name url; do
            [ -z "$name" ] && continue
            case "$url" in
              *instagram.com*) yt-dlp -q --cookies /tmp/ig.txt -f "b[ext=mp4]/b" -o "$D/got/$name.%(ext)s" "$url" || echo "FAIL $name" >> $D/got/log.txt ;;
              *) curl -fsSL -A "Mozilla/5.0" -o "$D/got/$name" "$url" || echo "FAIL $name" >> $D/got/log.txt ;;
            esac
          done < $D/fetch.txt
          ls -la $D/got
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add $D/got; git commit -m "fetched files" && git pull --rebase -q && git push
