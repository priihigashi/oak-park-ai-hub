name: fetch-list-ajude-votar
on:
  push:
    branches: ['media/ajude-votar-2026-10-25']
    paths: ['media-share/2026-10-25-alerta-onibus/fetch.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        env:
          IGC: ${{ secrets.PRI_OP_IG_COOKIES }}
        run: |
          pip install -q yt-dlp
          D=media-share/2026-10-25-alerta-onibus
          printf '%s' "$IGC" > /tmp/ig.txt
          if ! grep -q "instagram" /tmp/ig.txt; then echo "$IGC" | base64 -d > /tmp/ig.txt 2>/dev/null || true; fi
          mkdir -p $D/got
          while IFS='|' read -r name url; do
            [ -z "$name" ] && continue
            case "$url" in
              wiki:*) t="${url#wiki:}"; img=$(curl -fsSL -A "Mozilla/5.0 (priihigashi bot)" "https://pt.wikipedia.org/w/api.php?action=query&format=json&prop=pageimages&piprop=original&redirects=1&titles=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$t")" | python3 -c "import json,sys;d=json.load(sys.stdin);print(next(iter(d['query']['pages'].values())).get('original',{}).get('source',''))"); echo "$name $img" >> $D/got/log.txt; [ -n "$img" ] && curl -fsSL -A "Mozilla/5.0 (priihigashi bot)" -o "$D/got/$name.${img##*.}" "$img" || echo "FAIL $name" >> $D/got/log.txt ;;
              wikis:*) q="${url#wikis:}"; img=$(curl -fsSL -A "Mozilla/5.0 (priihigashi bot)" "https://pt.wikipedia.org/w/api.php?action=query&format=json&generator=search&gsrlimit=1&prop=pageimages&piprop=original&gsrsearch=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")" | python3 -c "import json,sys;d=json.load(sys.stdin);print(next(iter(d['query']['pages'].values())).get('original',{}).get('source',''))" ); echo "$name $img" >> $D/got/log.txt; [ -n "$img" ] && curl -fsSL -A "Mozilla/5.0 (priihigashi bot)" -o "$D/got/$name.img" "$img" || echo "FAIL $name" >> $D/got/log.txt ;;
              og:*) pg="${url#og:}"; img=$(curl -fsSL -A "Mozilla/5.0" "$pg" | python3 -c "import re,sys,html;t=sys.stdin.read();m=re.search(r'<meta[^>]+property=[\"\']og:image[\"\'][^>]+content=[\"\']([^\"\']+)',t) or re.search(r'content=[\"\']([^\"\']+)[\"\'][^>]+property=[\"\']og:image',t);print(html.unescape(m.group(1)) if m else '')"); echo "$name $img" >> $D/got/log.txt; [ -n "$img" ] && curl -fsSL -A "Mozilla/5.0" -o "$D/got/$name.img" "$img" || echo "FAIL $name" >> $D/got/log.txt ;;
              whisper:*) f="${url#whisper:}"; pip install -q faster-whisper > $D/got/err_$name.txt 2>&1; python3 $D/wh.py "$f" "$D/got/$name.json" >> $D/got/err_$name.txt 2>&1 || echo "FAIL $name" >> $D/got/log.txt ;;
              *instagram.com*) yt-dlp --cookies /tmp/ig.txt -o "$D/got/$name.%(ext)s" "$url" > $D/got/err_$name.txt 2>&1 || echo "FAIL $name" >> $D/got/log.txt ;;
              *) curl -fsSL -A "Mozilla/5.0" -o "$D/got/$name" "$url" || echo "FAIL $name" >> $D/got/log.txt ;;
            esac
          done < $D/fetch.txt
          ls -la $D/got
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add $D/got; git rm -q --cached "$D/got/"*'.org&'* 2>/dev/null || true; git commit -m "fetched files" && git pull --rebase -q && git push
