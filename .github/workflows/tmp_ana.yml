name: tmp_ana
on:
  push:
    branches: [tmp/pavinatto-erika]
    paths: ['.github/workflows/tmp_ana.yml']
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: sudo apt-get install -y -qq ffmpeg
      - run: pip install -q faster-whisper numpy
      - run: |
          mkdir -p job_out
          curl -sfL -o job_out/ana_full.mp3 "https://elevenlabsusercontent.com/database/workspace/cfd0c30d08bb461c800962f2f06538b3/content_generation/w2DwAvO9UhSTyI6jfBl6/TB4tOSxltE7xFuDx0FjQ/content.mp3?Expires=1795597200&KeyName=assets-cdn-key-1&Signature=jlrG6a1VzuugvBx-oYbc2eQGFIU="
          ls -la job_out/ana_full.mp3
          cat > /tmp/t.py <<'PY'
          import json,subprocess,numpy as np
          from faster_whisper import WhisperModel
          m=WhisperModel('small',compute_type='int8')
          raw=subprocess.run(['ffmpeg','-loglevel','error','-i','job_out/ana_full.mp3','-f','f32le','-ac','1','-ar','16000','-'],capture_output=True).stdout
          segs,_=m.transcribe(np.frombuffer(raw,dtype=np.float32),language='pt',word_timestamps=True)
          w=[[round(x.start,2),round(x.end,2),x.word.strip()] for s in segs for x in s.words]
          json.dump(w,open('job_out/ana_full.json','w'),ensure_ascii=False)
          PY
          python /tmp/t.py
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add job_out; git commit -m ana || exit 0
          git pull --rebase; git push
