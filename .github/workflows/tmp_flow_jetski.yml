name: tmp flow jetski clip
on:
  push:
    branches: [tmp-flow-jetski]
    paths: ['.github/workflows/tmp_flow_jetski.yml']
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: tmp-flow-jetski}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - run: pip install -q -U yt-dlp faster-whisper numpy requests
      - name: download section via project downloader
        env:
          PRI_OP_YT_COOKIES: ${{ secrets.PRI_OP_YT_COOKIES }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          CI: "1"
        run: |
          mkdir -p tmp
          python3 - <<'PY' > tmp/dl.log 2>&1 || true
          import sys, subprocess
          sys.path.insert(0, "scripts/capture")
          import video_downloader as vd
          url = "https://www.youtube.com/watch?v=EToS1HBw64Q"
          args = vd._cookie_args(url, prefer_browser=False)
          print("cookie args present:", bool(args))
          cmd = ["yt-dlp","--no-update",*args,"-f","bv*[height<=480][ext=mp4]+ba[ext=m4a]/b[height<=480]/b",
                 "--merge-output-format","mp4","--download-sections","*3:12:30-3:22:30","-o","tmp/flow.%(ext)s",url]
          r = subprocess.run(cmd, capture_output=True, text=True)
          print(r.stderr[-600:])
          import os
          if not os.path.exists("tmp/flow.mp4"):
              print("trying apify route")
              items = vd._apify_run_items("apidojo~youtube-scraper", {"startUrls":[{"url":url}],"maxItems":1}, limit=1)
              print("items:", len(items))
              mu = vd._extract_media_url(items[0]) if items else ""
              print("media url found:", bool(mu))
              if mu:
                  r2 = subprocess.run(["ffmpeg","-nostdin","-v","error","-y","-ss","3:12:30","-i",mu,"-t","600","-c","copy","tmp/flow.mp4"],capture_output=True,text=True)
                  print("ffmpeg:", r2.returncode, r2.stderr[-400:])
                  if r2.returncode!=0 or not os.path.exists("tmp/flow.mp4"):
                      t=__import__("pathlib").Path("tmp")
                      print("full download:", vd._download_http_media(mu, t/"full.mp4", min_bytes=100000))
                      if (t/"full.mp4").exists():
                          subprocess.run(["ffmpeg","-nostdin","-v","error","-y","-ss","3:12:30","-i","tmp/full.mp4","-t","600","-c","copy","tmp/flow.mp4"])
                          (t/"full.mp4").unlink()
          PY
          ls -la tmp
      - name: transcribe
        run: |
          python3 - <<'PY'
          import os,json,subprocess,numpy as np
          f='tmp/flow.mp4'
          if os.path.exists(f):
              from faster_whisper import WhisperModel
              raw=subprocess.run(["ffmpeg","-nostdin","-v","error","-i",f,"-ac","1","-ar","16000","-f","s16le","-"],capture_output=True).stdout
              A=np.frombuffer(raw,np.int16).astype(np.float32)/32768
              m=WhisperModel("small",device="cpu",compute_type="int8")
              segs,_=m.transcribe(A,language="pt",word_timestamps=True)
              json.dump([{"s":s.start,"e":s.end,"t":s.text} for s in segs],open("tmp/flow.json","w"),ensure_ascii=False)
          PY
      - name: commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -f tmp || true
          git commit -m "tmp: flow jetski download" || echo nothing
          for i in 1 2 3; do git pull -q --rebase -X theirs origin tmp-flow-jetski && git push && break; done
