name: TEMP — Ads Toolchain Repair Probe

on:
  push:
    branches:
      - fix/google-ads-reporting-truth-2026-08-26
    paths:
      - '.github/workflows/ads_toolchain_repair_probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gsc-fail-loud-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run repaired GSC sync using production secret
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: node scripts/gsc-sync.js

  weekly-target-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Print only spreadsheet metadata and tab titles for CONTENT_SHEET_ID
        env:
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
          CONTENT_SHEET_ID: ${{ secrets.CONTENT_SHEET_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          td=json.loads(os.environ['SHEETS_TOKEN'])
          body=urllib.parse.urlencode({'client_id':td['client_id'],'client_secret':td['client_secret'],'refresh_token':td['refresh_token'],'grant_type':'refresh_token'}).encode()
          token=json.loads(urllib.request.urlopen(urllib.request.Request('https://oauth2.googleapis.com/token', body)).read())['access_token']
          sid=os.environ['CONTENT_SHEET_ID']
          url=f'https://sheets.googleapis.com/v4/spreadsheets/{sid}?fields=properties.title,sheets.properties.title'
          data=json.loads(urllib.request.urlopen(urllib.request.Request(url,headers={'Authorization':f'Bearer {token}'})).read())
          print('SPREADSHEET_TITLE='+data.get('properties',{}).get('title',''))
          for s in data.get('sheets',[]): print('TAB='+s.get('properties',{}).get('title',''))
          PY
