name: Drive Rename Files

on:
  workflow_dispatch:
    inputs:
      folder_id:
        description: 'Drive folder containing the files'
        required: true
        type: string
      pairs:
        description: 'oldname=newname pairs, comma separated'
        required: true
        type: string

permissions:
  contents: read

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rename
        env:
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
          FOLDER_ID: ${{ inputs.folder_id }}
          PAIRS: ${{ inputs.pairs }}
        run: |
          pip install -q google-auth google-auth-oauthlib google-api-python-client
          python3 << 'PYEOF'
          import os, json
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          td = json.loads(os.environ['SHEETS_TOKEN'])
          creds = Credentials(token=td.get('token'), refresh_token=td.get('refresh_token'),
              token_uri=td.get('token_uri','https://oauth2.googleapis.com/token'),
              client_id=td.get('client_id'), client_secret=td.get('client_secret'),
              scopes=td.get('scopes'))
          if not creds.valid:
              creds.refresh(Request())
          drive = build('drive','v3',credentials=creds)

          folder = os.environ['FOLDER_ID']
          mapping = {}
          for pair in os.environ['PAIRS'].split(','):
              if '=' in pair:
                  o, n = pair.split('=', 1)
                  mapping[o.strip()] = n.strip()

          files, token = [], None
          while True:
              resp = drive.files().list(
                  q=f"'{folder}' in parents and trashed = false",
                  fields='nextPageToken, files(id,name)', pageSize=200, pageToken=token,
                  supportsAllDrives=True, includeItemsFromAllDrives=True).execute()
              files.extend(resp.get('files', []))
              token = resp.get('nextPageToken')
              if not token:
                  break

          by_name = {f['name']: f['id'] for f in files}
          done = 0
          for old, new in mapping.items():
              fid = by_name.get(old)
              if not fid:
                  print(f"MISSING {old}")
                  continue
              drive.files().update(fileId=fid, body={'name': new}, fields='id',
                                   supportsAllDrives=True).execute()
              print(f"{old}  ->  {new}")
              done += 1
          print(f"\nrenamed {done}")
          PYEOF
