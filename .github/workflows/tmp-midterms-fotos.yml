name: tmp-midterms-fotos
on:
  push:
    branches: [tmp-midterms-fotos]
    paths: ['job/run.py']
permissions:
  contents: write
jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install "rembg[cpu]" pillow requests
      - run: python job/run.py
      - run: |
          git config user.name "midterms-bot"
          git config user.email "bot@users.noreply.github.com"
          git add job/out
          git commit -m "cutouts [skip ci]"
          for i in 1 2 3; do git pull --rebase origin tmp-midterms-fotos && git push && break; sleep 5; done
