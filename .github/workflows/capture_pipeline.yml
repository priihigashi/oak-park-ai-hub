name: Capture Pipeline v2

# ─── HOW TO USE ────────────────────────────────────────────────────────────
# Anyone can trigger this workflow manually from GitHub Actions.
#
# Steps:
#   1. Go to: github.com/priihigashi/oak-park-ai-hub
#      → Actions → Capture Pipeline v2 → Run workflow
#
#   2. Fill in the fields:
#      • url       → Paste the reel link (Instagram, TikTok, or YouTube)
#      • project   → Choose the niche, or leave as "auto" to let the
#                    system detect it from the content automatically.
#                    Options: auto | brazil | opc | usa | ugc | stocks | higashi | book
#      • story_id  → Leave blank — it will be generated automatically.
#                    Only fill in if adding to an existing story (e.g. BCI-002)
#      • notes     → Optional extra context to help the pipeline, e.g.:
#                    "verify who this person is" or "check presidential statements"
#      • credits   → Check this box to fetch the creator's name/handle
#                    for caption attribution
#      • mode      → "capture" (default) = the full pipeline below.
#                    "transcribe_only"   = "just tell me what this video says".
#                    Still downloads, transcribes and saves the Drive outputs,
#                    but files NOTHING: no Inspiration Library row, no Calendar
#                    brief, no Ideas Queue row, no Inbox task, no Book Tracker
#                    row, no topic-scraper or evidence-mining dispatch, and the
#                    Capture Queue row is left untouched.
#
#   3. Click "Run workflow"
#
# What happens next (automatic, mode = capture):
#   → Downloads the reel audio
#   → Transcribes with Whisper
#   → Classifies niche via Claude
#   → Saves to Inspiration Library (Google Sheets)
#   → Creates a task in Google Calendar with content brief
# ───────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL of the reel (Instagram, TikTok, or YouTube)"
        required: true
        type: string
      project:
        description: "auto = let runner classify (default). Or pick a niche explicitly."
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - book
          - brazil
          - bias
          - opc
          - ugc
          - usa
          - stocks
          - higashi
          - unrouted
      story_id:
        description: "Story ID e.g. BCI-002 or NWS-001 (blank = auto-generate)"
        required: false
        type: string
        default: ""
      notes:
        description: "Extra context (e.g. verify who this is, check presidential statements)"
        required: false
        type: string
        default: ""
      credits:
        description: "Fetch creator info via Apify for caption attribution"
        required: false
        type: boolean
        default: false
      mode:
        description: "capture = full pipeline (default). transcribe_only = transcript + frames only, no Inspiration Library row, no Calendar brief."
        required: false
        default: "capture"
        type: choice
        options:
          - capture
          - transcribe_only
      url2:
        description: "Optional second URL (companion clip — e.g. show clip for last slide)"
        required: false
        type: string
        default: ""
      url2_role:
        description: "Role label for url2 (e.g. show_clip_for_last_slide, outro_clip)"
        required: false
        type: string
        default: "companion_clip"
      projects:
        description: "SH-014 fan-out: comma-separated niches (e.g. 'brazil,usa'). Download once, route to each. Overrides 'project' when set."
        required: false
        type: string
        default: ""

jobs:
  capture:
    name: "${{ inputs.project }} — ${{ inputs.story_id || 'auto-id' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Normal capture can dispatch downstream workflows, so Actions write is
    # required by the current architecture. Everything else is denied unless
    # explicitly listed here. Transcribe-only suppresses those dispatches in
    # capture_pipeline.py; splitting that mode into its own read-only job is a
    # follow-up hardening opportunity.
    permissions:
      actions: write
      contents: read

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout oak-park-ai-hub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ffmpeg (required by yt-dlp)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install \
            yt-dlp \
            openai \
            anthropic \
            google-generativeai \
            faster-whisper \
            gspread \
            google-auth \
            google-api-python-client \
            python-dotenv \
            requests \
            youtube-transcript-api \
            instaloader \
            pytubefix \
            playwright

      - name: Install Playwright Chromium (best-effort — SH-024 article screenshots)
        run: python -m playwright install chromium --with-deps || true

      - name: Run capture pipeline
        env:
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_KEY_4_CONTENT: ${{ secrets.CLAUDE_KEY_4_CONTENT }}
          SHEETS_TOKEN:      ${{ secrets.SHEETS_TOKEN }}
          GITHUB_TOKEN:      ${{ github.token }}
          APIFY_API_KEY:     ${{ secrets.APIFY_API_KEY }}
          SERP_API_KEY:      ${{ secrets.SERP_API_KEY }}
          SUPADATA_API_KEY:  ${{ secrets.PRI_OP_SUPADATA_API_KEY || secrets.SUPADATA_API_KEY }}
          YOUTUBE_API_KEY:   ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          PRI_OP_GMAIL_APP_PASSWORD: ${{ secrets.PRI_OP_GMAIL_APP_PASSWORD }}
          PRI_OP_YT_COOKIES: ${{ secrets.PRI_OP_YT_COOKIES }}
          PRI_OP_IG_COOKIES: ${{ secrets.PRI_OP_IG_COOKIES }}

          # workflow_dispatch inputs are data, not shell source. Keep them in
          # environment variables and pass them through a Bash argv array so
          # quotes, semicolons, substitutions, and newlines cannot become code.
          CAPTURE_URL:       ${{ inputs.url }}
          CAPTURE_PROJECT:   ${{ inputs.project }}
          CAPTURE_STORY_ID:  ${{ inputs.story_id }}
          CAPTURE_NOTES:     ${{ inputs.notes }}
          CAPTURE_CREDITS:   ${{ inputs.credits }}
          CAPTURE_MODE:      ${{ inputs.mode }}
          CAPTURE_URL2:      ${{ inputs.url2 }}
          CAPTURE_URL2_ROLE: ${{ inputs.url2_role }}
          CAPTURE_PROJECTS:  ${{ inputs.projects }}
        shell: bash
        run: |
          set -euo pipefail

          cmd=(python scripts/capture/capture_pipeline.py "$CAPTURE_URL" --project "$CAPTURE_PROJECT")

          if [[ -n "$CAPTURE_STORY_ID" ]]; then
            cmd+=(--story-id "$CAPTURE_STORY_ID")
          fi

          if [[ -n "$CAPTURE_NOTES" ]]; then
            cmd+=(--notes "$CAPTURE_NOTES")
          fi

          if [[ "$CAPTURE_CREDITS" == "true" ]]; then
            cmd+=(--credits)
          fi

          if [[ "$CAPTURE_MODE" == "transcribe_only" ]]; then
            cmd+=(--transcribe-only)
          fi

          if [[ -n "$CAPTURE_URL2" ]]; then
            cmd+=(--url2 "$CAPTURE_URL2")
          fi

          if [[ -n "$CAPTURE_URL2_ROLE" && "$CAPTURE_URL2_ROLE" != "companion_clip" ]]; then
            cmd+=(--url2-role "$CAPTURE_URL2_ROLE")
          fi

          if [[ -n "$CAPTURE_PROJECTS" ]]; then
            cmd+=(--projects "$CAPTURE_PROJECTS")
          fi

          printf 'Running capture pipeline (mode=%s, project=%s)\n' "$CAPTURE_MODE" "$CAPTURE_PROJECT"
          "${cmd[@]}"

      - name: Upload transcripts and analysis
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: "capture-${{ inputs.story_id || github.run_id }}-${{ inputs.project }}"
          path: transcripts/
          retention-days: 30

      - name: Send failure notification (realtime, compact thread)
        if: failure()
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: priscila@oakpark-construction.com
          password: ${{ secrets.PRI_OP_GMAIL_APP_PASSWORD }}
          to: priscila@oakpark-construction.com
          from: Oak Park AI <priscila@oakpark-construction.com>
          subject: "CAPTURE FAILED — Realtime Alert"
          body: |
            A capture run failed.

            URL: ${{ inputs.url }}
            Project: ${{ inputs.project }}
            Story ID: ${{ inputs.story_id || 'auto' }}
            Run number: ${{ github.run_number }}

            Check the run logs:
            https://github.com/priihigashi/oak-park-ai-hub/actions/runs/${{ github.run_id }}

      - name: Update Build Tracker
        if: always()
        env:
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
        run: |
          pip install pytz -q
          python3 scripts/build_tracker_writer.py \
            --workflow capture_pipeline.yml \
            --status "${{ job.status }}"
