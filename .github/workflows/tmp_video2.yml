name: tmp-video2-fetch
on:
  push:
    branches: [tmp-video2]
    paths: ['tmp_v2/go.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: tmp-video2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          pip install -q -U yt-dlp faster-whisper edge-tts
          mkdir -p tmp_v2/out
          n=0
          mapfile -t Q < tmp_v2/go.txt
          for q in "${Q[@]}"; do
            [ -z "$q" ] && continue
            n=$((n+1))
            yt-dlp --no-playlist -f "bv*[height<=720]+ba/b[height<=720]/b" --merge-output-format mp4 \
              --download-sections "*0-300" --write-info-json -o "/tmp/dl_$n.%(ext)s" "$q" > tmp_v2/out/log_$n.txt 2>&1 < /dev/null || true
            if [ -f /tmp/dl_$n.mp4 ]; then
              ffmpeg -v error -y -i /tmp/dl_$n.mp4 -vf "scale=-2:540" -c:v libx264 -crf 30 -preset veryfast -c:a aac -b:a 96k tmp_v2/out/v$n.mp4
              python3 -c "import json,sys;d=json.load(open('/tmp/dl_$n.info.json'));json.dump({k:d.get(k) for k in ['title','uploader','channel','webpage_url','duration','upload_date']},open('tmp_v2/out/v$n.json','w'))" || true
              ffmpeg -v error -y -i tmp_v2/out/v$n.mp4 -ac 1 -ar 16000 /tmp/a$n.wav
              python3 - "$n" <<'PY'
          import json,sys
          from faster_whisper import WhisperModel
          n=sys.argv[1]
          m=WhisperModel("small.en",device="cpu",compute_type="int8")
          segs,_=m.transcribe(f"/tmp/a{n}.wav",word_timestamps=True,language="en")
          out=[{"w":w.word.strip(),"s":round(w.start,2),"e":round(w.end,2)} for s in segs for w in s.words]
          json.dump(out,open(f"tmp_v2/out/w{n}.json","w"))
          PY
            fi
          done
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add tmp_v2/out && git commit -m "out" && git pull --rebase && git push
