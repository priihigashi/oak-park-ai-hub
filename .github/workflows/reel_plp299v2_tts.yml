name: reel plp299 video2 - voz provisoria

on:
  push:
    branches: [reel/plp299-video2]
    paths: ["reels/plp299-video2/script.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reel/plp299-video2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install edge-tts
      - name: Voz (Thalita, uma tomada so) + tempos por palavra
        run: |
          mkdir -p reels/plp299-video2/out
          python - <<'EOF'
          import asyncio, json, edge_tts
          txt = open("reels/plp299-video2/script.txt", encoding="utf-8").read()
          rate = open("reels/plp299-video2/rate.txt").read().strip() if __import__("os").path.exists("reels/plp299-video2/rate.txt") else "+0%"
          async def main():
              c = edge_tts.Communicate(txt, "pt-BR-ThalitaMultilingualNeural", rate=rate, boundary="WordBoundary")
              words = []
              with open("reels/plp299-video2/out/voz.mp3", "wb") as f:
                  async for ch in c.stream():
                      if ch["type"] == "audio":
                          f.write(ch["data"])
                      elif ch["type"] == "WordBoundary":
                          words.append({"t": round(ch["offset"]/1e7, 3), "d": round(ch["duration"]/1e7, 3), "w": ch["text"]})
              json.dump(words, open("reels/plp299-video2/out/words.json", "w", encoding="utf-8"), ensure_ascii=False)
              print("palavras", len(words), "fim", words[-1]["t"] + words[-1]["d"])
          asyncio.run(main())
          EOF
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add reels/plp299-video2/out
          git commit -m "voz provisoria plp299 video2" || true
          git push
