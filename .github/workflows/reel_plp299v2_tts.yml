name: reel plp299 video2 - voz provisoria

on:
  push:
    branches: [reel/plp299-video2]
    paths: ["reels/plp299-video2/script.txt", "reels/plp299-video2/rate.txt", ".github/workflows/reel_plp299v2_tts.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reel/plp299-video2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install edge-tts
      - name: Voz (Thalita, uma tomada so) + tempos por palavra
        run: |
          mkdir -p reels/plp299-video2/out
          python - <<'EOF'
          import asyncio, json, edge_tts
          txt = open("reels/plp299-video2/script.txt", encoding="utf-8").read()
          rate = open("reels/plp299-video2/rate.txt").read().strip() if __import__("os").path.exists("reels/plp299-video2/rate.txt") else "+0%"
          async def gen(voice, r):
              c = edge_tts.Communicate(txt, voice, rate=r, boundary="WordBoundary")
              words = []; buf = bytearray()
              async for ch in c.stream():
                  if ch["type"] == "audio":
                      buf.extend(ch["data"])
                  elif ch["type"] == "WordBoundary":
                      words.append({"t": round(ch["offset"]/1e7, 3), "d": round(ch["duration"]/1e7, 3), "w": ch["text"]})
              return bytes(buf), words
          async def main():
              vs = await edge_tts.list_voices()
              print([v["ShortName"] for v in vs if "pt-BR" in v["ShortName"] or "Andrew" in v["ShortName"] or "Thalita" in v["ShortName"]])
              last = None
              for voice in ["pt-BR-ThalitaMultilingualNeural", "en-US-AndrewMultilingualNeural"]:
                  for r in [rate, "+0%"]:
                      for attempt in range(3):
                          try:
                              audio, words = await gen(voice, r)
                              if audio:
                                  open("reels/plp299-video2/out/voz.mp3", "wb").write(audio)
                                  json.dump(words, open("reels/plp299-video2/out/words.json", "w", encoding="utf-8"), ensure_ascii=False)
                                  open("reels/plp299-video2/out/voice.txt", "w").write(voice + " " + r)
                                  print("ok", voice, r, len(words), words[-1]["t"] + words[-1]["d"] if words else 0)
                                  return
                          except Exception as e:
                              last = e; print("falhou", voice, r, attempt, e)
                              await asyncio.sleep(3)
              raise SystemExit(f"sem audio: {last}")
          asyncio.run(main())
          EOF
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add reels/plp299-video2/out
          git commit -m "voz provisoria plp299 video2" || true
          git push
