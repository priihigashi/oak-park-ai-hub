name: tmp-nikolas-plantou-job
on:
  push:
    branches: [tmp-nikolas-plantou]
    paths: ['job/job.json']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-nikolas-plantou
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q edge-tts faster-whisper
      - name: tts
        run: python job/run.py
      - name: commit
        run: |
          git config user.name "claude-bot"
          git config user.email "claude-bot@users.noreply.github.com"
          git add out
          git commit -m "out [skip ci]" || echo nothing
          git push
