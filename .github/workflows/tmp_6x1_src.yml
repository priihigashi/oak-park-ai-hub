name: tmp-6x1-src
on:
  push:
    branches: [tmp-6x1-src]
    paths: [run.txt]
permissions:
  contents: write
jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-6x1-src
      - name: all
        run: |
          exec > >(tee out/log2.txt) 2>&1
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q faster-whisper numpy
          ffmpeg -loglevel error -y -i out/src.mp4 -ac 1 -ar 16000 -f s16le out/a.raw
          python - <<'EOF'
          import json, numpy as np
          from faster_whisper import WhisperModel
          a = np.frombuffer(open('out/a.raw','rb').read(), np.int16).astype(np.float32)/32768.0
          m = WhisperModel('large-v3', device='cpu', compute_type='int8')
          segs, info = m.transcribe(a, language='pt', word_timestamps=True, vad_filter=True)
          out=[]; txt=[]
          for s in segs:
              out.append({'start':s.start,'end':s.end,'text':s.text,'words':[{'w':w.word,'s':w.start,'e':w.end} for w in (s.words or [])]})
              txt.append(f"[{s.start:6.1f}-{s.end:6.1f}] {s.text.strip()}")
          json.dump(out,open('out/transcript.json','w'),ensure_ascii=False,indent=1)
          open('out/transcript.txt','w').write('\n'.join(txt))
          EOF
          rm -f out/a.raw
      - name: commit
        if: always()
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git pull --rebase origin tmp-6x1-src || true
          rm -f out/a.raw
          git add out && git commit -m "out: transcript" && git push
