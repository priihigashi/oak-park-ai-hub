name: tmp distrital misto
on:
  push:
    branches: [tmp-distrital-misto]
    paths: [job.json, tools/**, .github/workflows/tmp-distrital-misto.yml]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install edge-tts "rembg[cpu]" mediapipe==0.10.14 pillow numpy requests scipy
      - run: python tools/tts.py || true
      - run: python tools/faces.py || true
      - run: pip install yt-dlp faster-whisper && python tools/ref.py || true
        env:
          PRI_OP_IG_COOKIES: ${{ secrets.PRI_OP_IG_COOKIES }}
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add out; git commit -m "out [skip ci]" || true; git push
