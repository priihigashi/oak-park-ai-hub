name: Nonnegotiables Updater

on:
  schedule:
    # 2:00 AM ET daily (before inventory at 3 AM, before 4AM agent at 4 AM).
    # `timezone:` makes this DST-safe. The previous `cron: '0 7 * * *'` had no
    # timezone, so it ran at 07:00 UTC = 03:00 EDT in summer — an hour later than
    # the comment claimed, and it would have drifted to 02:00 only in winter.
    - cron: '0 2 * * *'
      timezone: America/New_York
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    # Raised from 10: the updater now waits on a quality-gate run before it can
    # land on main (see scripts/ci/push_prevalidated_main.sh). The gate itself
    # takes ~25s, but queueing can add minutes.
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write   # helper opens+merges a PR (see scripts/ci/push_prevalidated_main.sh)

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # full history: push_prevalidated_main.sh may rebase onto a moved main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytz requests

      - name: Print current NONNEGOTIABLES (for audit trail in logs)
        run: |
          echo "===== NONNEGOTIABLES.md ====="
          cat NONNEGOTIABLES.md
          echo "============================="

      - name: Run updater
        env:
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
          GIT_AUTHOR_NAME: nonnegotiables-bot
          GIT_AUTHOR_EMAIL: actions@github.com
          GIT_COMMITTER_NAME: nonnegotiables-bot
          GIT_COMMITTER_EMAIL: actions@github.com
          # push_prevalidated_main.sh shells out to `gh` to dispatch the quality
          # gate and read its check runs — without GH_TOKEN it cannot authenticate.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/nonnegotiables_updater.py

      - name: Alert on failure
        if: failure()
        run: |
          gh workflow run send_email.yml \
            --repo priihigashi/oak-park-ai-hub \
            -f to="priscila@oakpark-construction.com" \
            -f subject="[nonnegotiables] Updater failed — $(date +%Y-%m-%d)" \
            -f body="Nonnegotiables updater failed. Check: https://github.com/priihigashi/oak-park-ai-hub/actions/workflows/nonnegotiables.yml"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Build Tracker
        if: always()
        env:
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
        run: |
          pip install pytz -q
          python3 scripts/build_tracker_writer.py \
            --workflow nonnegotiables.yml \
            --status "${{ job.status }}"
