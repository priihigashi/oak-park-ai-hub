name: tmp-tts-fotos  # v2 26/11
on:
  push:
    branches: ['tmp/**']
    paths: ['.github/workflows/tmp_tts.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q edge-tts
      - name: voz
        run: python3 tts_in/gen.py
      - name: gravar
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add tts_out
          git commit -m 'tts v2'
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break; sleep 5; done
