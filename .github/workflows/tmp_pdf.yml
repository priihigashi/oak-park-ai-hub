name: tmp-pdf
on:
  push:
    branches: ['tmp/**']
    paths: ['.github/workflows/tmp_pdf.yml']
permissions:
  contents: write
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: baixar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          mkdir -p pdf_out
          curl -sL -A 'Mozilla/5.0' -o pdf_out/parecer.pdf 'https://legis.senado.gov.br/sdleg-getter/documento/download/77783059-d02e-4b6a-b5ea-aef1a02619d7?rendition_principal=S&disposition=inline'
          curl -sL -A 'Mozilla/5.0' -o pdf_out/emendas_rp.pdf 'https://legis.senado.gov.br/sdleg-getter/documento/download/5dc096aa-ee74-482b-b4d0-2fc68361807f?disposition=inline'
          file pdf_out/*.pdf
          pdftotext -layout pdf_out/parecer.pdf pdf_out/parecer.txt || true
          pdftotext -layout pdf_out/emendas_rp.pdf pdf_out/emendas_rp.txt || true
          rm -f pdf_out/*.pdf
          wc -c pdf_out/*
      - name: gravar
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add pdf_out
          git commit -m 'pdf parecer'
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break; sleep 5; done
