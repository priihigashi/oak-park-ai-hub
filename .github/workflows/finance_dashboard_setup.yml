name: Finance Dashboard Setup (one-shot)

# Fires when code is pushed to the finance-dashboard-setup branch.
# Writes NPER debt payoff formulas to the personal Finance Dashboard.
# Spreadsheet: 1U7n7OttHExXOmMtusu-3PuI4xBqzGz8LSiISfIMxu64
# Safe to re-run: all writes are idempotent (overwrites, no append).

on:
  push:
    branches:
      - finance-dashboard-setup

jobs:
  write_formulas:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install gspread google-auth

      - name: Write Finance Dashboard formulas
        env:
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
          PRI_OP_GMAIL_APP_PASSWORD: ${{ secrets.PRI_OP_GMAIL_APP_PASSWORD }}
        run: python scripts/finance/write_finance_dashboard.py
