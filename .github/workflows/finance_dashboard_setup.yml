name: Finance Dashboard — Write Formulas (one-shot)

# Fires once when code is pushed to the finance-dashboard-setup branch.
# Writes NPER-based debt payoff formulas + decision log to the Finance Dashboard.
# Spreadsheet: Personal Finance Dashboard (1U7n7OttHExXOmMtusu-3PuI4xBqzGz8LSiISfIMxu64)
# Safe to re-run: all writes are idempotent (overwrites, no append).

on:
  push:
    branches: [finance-dashboard-setup]

jobs:
  write_formulas:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install gspread google-auth

      - name: Write Finance Dashboard formulas
        env:
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
          PRI_OP_GMAIL_APP_PASSWORD: ${{ secrets.PRI_OP_GMAIL_APP_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import os, json, smtplib, urllib.request, urllib.parse
          from email.mime.text import MIMEText
          import gspread
          from google.oauth2.credentials import Credentials

          # ── Auth (OAuth via SHEETS_TOKEN) ──────────────────────────────────────────
          td = json.loads(os.environ["SHEETS_TOKEN"])
          data = urllib.parse.urlencode({
              "client_id":     td["client_id"],
              "client_secret": td["client_secret"],
              "refresh_token": td["refresh_token"],
              "grant_type":    "refresh_token",
          }).encode()
          resp = json.loads(urllib.request.urlopen(
              "https://oauth2.googleapis.com/token", data=data
          ).read())
          creds = Credentials(
              token=resp["access_token"],
              refresh_token=td["refresh_token"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=td["client_id"],
              client_secret=td["client_secret"],
          )
          gc = gspread.authorize(creds)

          SHEET_ID = "1U7n7OttHExXOmMtusu-3PuI4xBqzGz8LSiISfIMxu64"
          sh = gc.open_by_key(SHEET_ID)

          # ── 1. 01 Cards Master — populate card names (col A+B, rows 2-6) ──────────
          ws1 = sh.worksheet("01 Cards Master")
          ws1.update(
              "A2:B6",
              [
                  ["Discover",        "Discover"],
                  ["Chase",           "Chase"],
                  ["Bank of America", "Bank of America"],
                  ["Citi",            "Citi"],
                  ["Affirm",          "Affirm"],
              ],
              value_input_option="USER_ENTERED",
          )
          print("✅ 01 Cards Master — card names written (A2:B6)")

          # ── 2. 02 Debt Payoff Simulator — full NPER formula grid ─────────────────
          ws2 = sh.worksheet("02 Debt Payoff Simulator")

          simulator_data = [
              # Row 1 (A1): title
              ["DEBT PAYOFF SIMULATOR — Auto-updates when 01 Cards Master is filled",
               "", "", "", "", "", "", "", "", "", "", "", ""],
              # Row 2 (A2): note
              ["NOTE: Months assumes stated minimum as a FIXED payment. Snowball = lowest balance first. Avalanche = highest APR first.",
               "", "", "", "", "", "", "", "", "", "", "", ""],
              # Row 3: spacer
              ["", "", "", "", "", "", "", "", "", "", "", "", ""],
              # Row 4 (A4): column headers
              ["Card", "Balance ($)", "APR (%)", "Min Pmt ($)",
               "Min Only — Months", "Min Only — Interest ($)",
               "+$100/mo — Months", "+$100/mo — Interest ($)",
               "+$200/mo — Months", "+$200/mo — Interest ($)",
               "Interest Saved (+$200)", "Snowball Order", "Avalanche Order"],
              # Row 5 (A5): Discover
              ["='01 Cards Master'!A2",
               "='01 Cards Master'!C2",
               "='01 Cards Master'!D2",
               "='01 Cards Master'!E2",
               '=IFERROR(CEILING(NPER(C5/100/12,-D5,B5),1),"")',
               '=IFERROR(ROUND(E5*D5-B5,2),"")',
               '=IFERROR(CEILING(NPER(C5/100/12,-(D5+100),B5),1),"")',
               '=IFERROR(ROUND(G5*(D5+100)-B5,2),"")',
               '=IFERROR(CEILING(NPER(C5/100/12,-(D5+200),B5),1),"")',
               '=IFERROR(ROUND(I5*(D5+200)-B5,2),"")',
               '=IFERROR(ROUND(F5-J5,2),"")',
               '=IFERROR(RANK(B5,$B$5:$B$9,1),"")',
               '=IFERROR(RANK(C5,$C$5:$C$9,0),"")'],
              # Row 6 (A6): Chase
              ["='01 Cards Master'!A3",
               "='01 Cards Master'!C3",
               "='01 Cards Master'!D3",
               "='01 Cards Master'!E3",
               '=IFERROR(CEILING(NPER(C6/100/12,-D6,B6),1),"")',
               '=IFERROR(ROUND(E6*D6-B6,2),"")',
               '=IFERROR(CEILING(NPER(C6/100/12,-(D6+100),B6),1),"")',
               '=IFERROR(ROUND(G6*(D6+100)-B6,2),"")',
               '=IFERROR(CEILING(NPER(C6/100/12,-(D6+200),B6),1),"")',
               '=IFERROR(ROUND(I6*(D6+200)-B6,2),"")',
               '=IFERROR(ROUND(F6-J6,2),"")',
               '=IFERROR(RANK(B6,$B$5:$B$9,1),"")',
               '=IFERROR(RANK(C6,$C$5:$C$9,0),"")'],
              # Row 7 (A7): Bank of America
              ["='01 Cards Master'!A4",
               "='01 Cards Master'!C4",
               "='01 Cards Master'!D4",
               "='01 Cards Master'!E4",
               '=IFERROR(CEILING(NPER(C7/100/12,-D7,B7),1),"")',
               '=IFERROR(ROUND(E7*D7-B7,2),"")',
               '=IFERROR(CEILING(NPER(C7/100/12,-(D7+100),B7),1),"")',
               '=IFERROR(ROUND(G7*(D7+100)-B7,2),"")',
               '=IFERROR(CEILING(NPER(C7/100/12,-(D7+200),B7),1),"")',
               '=IFERROR(ROUND(I7*(D7+200)-B7,2),"")',
               '=IFERROR(ROUND(F7-J7,2),"")',
               '=IFERROR(RANK(B7,$B$5:$B$9,1),"")',
               '=IFERROR(RANK(C7,$C$5:$C$9,0),"")'],
              # Row 8 (A8): Citi
              ["='01 Cards Master'!A5",
               "='01 Cards Master'!C5",
               "='01 Cards Master'!D5",
               "='01 Cards Master'!E5",
               '=IFERROR(CEILING(NPER(C8/100/12,-D8,B8),1),"")',
               '=IFERROR(ROUND(E8*D8-B8,2),"")',
               '=IFERROR(CEILING(NPER(C8/100/12,-(D8+100),B8),1),"")',
               '=IFERROR(ROUND(G8*(D8+100)-B8,2),"")',
               '=IFERROR(CEILING(NPER(C8/100/12,-(D8+200),B8),1),"")',
               '=IFERROR(ROUND(I8*(D8+200)-B8,2),"")',
               '=IFERROR(ROUND(F8-J8,2),"")',
               '=IFERROR(RANK(B8,$B$5:$B$9,1),"")',
               '=IFERROR(RANK(C8,$C$5:$C$9,0),"")'],
              # Row 9 (A9): Affirm
              ["='01 Cards Master'!A6",
               "='01 Cards Master'!C6",
               "='01 Cards Master'!D6",
               "='01 Cards Master'!E6",
               '=IFERROR(CEILING(NPER(C9/100/12,-D9,B9),1),"")',
               '=IFERROR(ROUND(E9*D9-B9,2),"")',
               '=IFERROR(CEILING(NPER(C9/100/12,-(D9+100),B9),1),"")',
               '=IFERROR(ROUND(G9*(D9+100)-B9,2),"")',
               '=IFERROR(CEILING(NPER(C9/100/12,-(D9+200),B9),1),"")',
               '=IFERROR(ROUND(I9*(D9+200)-B9,2),"")',
               '=IFERROR(ROUND(F9-J9,2),"")',
               '=IFERROR(RANK(B9,$B$5:$B$9,1),"")',
               '=IFERROR(RANK(C9,$C$5:$C$9,0),"")'],
              # Row 10: spacer
              ["", "", "", "", "", "", "", "", "", "", "", "", ""],
              # Row 11 (A11): TOTALS
              ["TOTALS",
               "=SUM(B5:B9)", "", "",
               "",
               "=SUM(F5:F9)",
               "",
               "=SUM(H5:H9)",
               "",
               "=SUM(J5:J9)",
               "=SUM(K5:K9)", "", ""],
              # Row 12: spacer
              ["", "", "", "", "", "", "", "", "", "", "", "", ""],
              # Row 13 (A13): PAYOFF SUMMARY header
              ["PAYOFF SUMMARY", "Min Only", "+$100/mo", "+$200/mo",
               "", "", "", "", "", "", "", "", ""],
              # Row 14 (A14): months to clear all debt
              ["Months to clear all debt",
               '=IFERROR(MAX(E5:E9),"")',
               '=IFERROR(MAX(G5:G9),"")',
               '=IFERROR(MAX(I5:I9),"")',
               "", "", "", "", "", "", "", "", ""],
              # Row 15 (A15): total interest paid
              ["Total interest paid ($)",
               '=IFERROR(SUM(F5:F9),"")',
               '=IFERROR(SUM(H5:H9),"")',
               '=IFERROR(SUM(J5:J9),"")',
               "", "", "", "", "", "", "", "", ""],
              # Row 16: spacer
              ["", "", "", "", "", "", "", "", "", "", "", "", ""],
              # Row 17 (A17): Snowball tip
              ["SNOWBALL: Pay minimums on all cards, then put every extra dollar toward the LOWEST BALANCE first. Fast wins build momentum.",
               "", "", "", "", "", "", "", "", "", "", "", ""],
              # Row 18 (A18): Avalanche tip
              ["AVALANCHE: Pay minimums on all cards, then put every extra dollar toward the HIGHEST APR first. Mathematically optimal — saves the most interest.",
               "", "", "", "", "", "", "", "", "", "", "", ""],
          ]

          ws2.update(
              "A1:M18",
              simulator_data,
              value_input_option="USER_ENTERED",
          )
          print("✅ 02 Debt Payoff Simulator — NPER formulas written (A1:M18)")

          # ── 3. 03 Decisions Log — headers + 4 pre-loaded decisions ──────────────
          ws3 = sh.worksheet("03 Decisions Log")

          decisions_data = [
              # Row 1 (A1): title
              ["DECISIONS LOG — Track every financial decision with context and revisit dates",
               "", "", "", "", ""],
              # Row 2: spacer
              ["", "", "", "", "", ""],
              # Row 3 (A3): column headers
              ["Date", "Decision", "Context / Options", "Revisit Date", "Status", "Notes"],
              # Row 4 (A4): decision 1
              ["2026-06-08",
               "Payoff order: Snowball vs Avalanche?",
               "Use 02 Debt Payoff Simulator after filling 01 Cards Master. Snowball = fastest psychological win. Avalanche = least total interest.",
               "2026-06-15", "PENDING",
               "Decide after adding real balances + APRs"],
              # Row 5 (A5): decision 2
              ["2026-06-08",
               "Discover card: Keep open or close?",
               "Closing oldest card reduces avg account age and can hurt credit score. Benefit: simplicity. Risk: score drop.",
               "2026-06-22", "PENDING",
               "Check credit report for account open date first"],
              # Row 6 (A6): decision 3
              ["2026-06-08",
               "Affirm: Priority level for payoff?",
               "Check Affirm app for actual APR (some plans = 0% promo, others = 36%). Priority depends on rate.",
               "2026-06-15", "PENDING",
               "Open Affirm app to confirm rate before ranking"],
              # Row 7 (A7): decision 4
              ["2026-06-08",
               "Phase 2: App vs sheet long-term?",
               "Phase 1 = Google Sheets (this week). Phase 2 = Vercel app conversion for mobile-friendly view. Evaluate at end of week.",
               "2026-06-12", "PENDING",
               "Revisit at end-of-week scoping session"],
          ]

          ws3.update(
              "A1:F7",
              decisions_data,
              value_input_option="USER_ENTERED",
          )
          print("✅ 03 Decisions Log — headers + 4 decisions written (A1:F7)")

          # ── Summary email ─────────────────────────────────────────────────────────
          body = """Finance Dashboard formulas are live!

Open your spreadsheet to see the results:
https://docs.google.com/spreadsheets/d/1U7n7OttHExXOmMtusu-3PuI4xBqzGz8LSiISfIMxu64

What was written:
• 01 Cards Master — Discover, Chase, Bank of America, Citi, Affirm names in A2:B6
• 02 Debt Payoff Simulator — Full NPER formula grid (A1:M18)
  - Min-only payoff months + interest
  - +$100/mo and +$200/mo scenarios
  - Snowball order (lowest balance first) + Avalanche order (highest APR first)
  - Payoff summary: months to clear all debt + total interest by scenario
• 03 Decisions Log — Headers + 4 pre-loaded pending decisions (A1:F7)

YOUR NEXT STEP (this week, before Friday June 12):
Open 01 Cards Master and fill in the real numbers from your card apps/statements:
  Col C: Balance ($)
  Col D: APR (%)
  Col E: Min Payment ($)
  Col F: Due Date
  Col G: Statement Date
  Col H: Credit Limit

Once you fill those in, the Simulator updates automatically.
"""
          msg = MIMEText(body)
          msg["Subject"] = "Finance Dashboard formulas are LIVE — fill in your card numbers"
          msg["From"] = "Oak Park AI <priscila@oakpark-construction.com>"
          msg["To"] = "priscila@oakpark-construction.com"

          pw = os.environ.get("PRI_OP_GMAIL_APP_PASSWORD", "")
          if pw:
              with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
                  s.login("priscila@oakpark-construction.com", pw)
                  s.send_message(msg)
              print("✅ Summary email sent to priscila@oakpark-construction.com")
          else:
              print("⚠️  PRI_OP_GMAIL_APP_PASSWORD not set — skipping email")

          print("🏁 Finance Dashboard setup complete.")
          PYEOF
