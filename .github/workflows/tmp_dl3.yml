name: tmp cowboy reel assets
on:
  push:
    branches: [tmp-reel-dl3]
permissions:
  contents: write
jobs:
  dl:
    if: "!contains(github.event.head_commit.message, 'result')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q edge-tts
      - run: python tts.py
      - run: |
          git config user.email noreply@anthropic.com; git config user.name Claude
          git add out && git commit -m "result assets" && git push
