name: OPC PRINT contracts (no paid APIs)
on:
  pull_request:
    paths:
      - 'scripts/factcheck_print/opc*'
      - 'scripts/factcheck_print/resolve_inputs.py'
      - 'tests/test_opc_print*'
      - '.github/workflows/opc_print_checks.yml'
      - '.github/workflows/factcheck_print.yml'
permissions:
  contents: read
concurrency:
  group: opc-print-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Contract regression tests (synthetic fixtures only)
        run: python -m unittest discover -s tests -p 'test_opc_print*.py' -v
