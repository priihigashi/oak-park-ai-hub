name: Weekly Report Generator

on:
  schedule:
    - cron: "0 13 * * 1"   # Every Monday at 9AM ET (UTC-4 EDT)
  workflow_dispatch:        # manual trigger — run any time to get current week snapshot

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytz

      - name: Generate Weekly Report
        env:
          SHEETS_TOKEN:              ${{ secrets.SHEETS_TOKEN }}
          CLAUDE_KEY_4_CONTENT:      ${{ secrets.CLAUDE_KEY_4_CONTENT }}
          GITHUB_TOKEN:              ${{ secrets.GITHUB_TOKEN }}
          CONTENT_SHEET_ID:          ${{ secrets.CONTENT_SHEET_ID }}
          PRI_OP_GMAIL_APP_PASSWORD: ${{ secrets.PRI_OP_GMAIL_APP_PASSWORD }}
          WEEKLY_REPORTS_FOLDER_ID:  "1gETNHiEtbkjYRimJOccDR9zssWSM4vNM"
          NOTIFY_EMAIL:              "priscila@oakpark-construction.com"
        run: |
          set -euo pipefail
          python scripts/weekly_report.py 2>&1 | tee /tmp/weekly-report.log

          # A green run is allowed only after both durable save and delivery are proven.
          if grep -Eiq 'Traceback|unauthorized|\b401\b|\b403\b|permission denied|Drive upload failed|could not read|email not sent' /tmp/weekly-report.log; then
            echo 'ERROR: Weekly Report contains a source/read/delivery failure.' >&2
            exit 1
          fi
          if ! grep -Fq 'Report saved:' /tmp/weekly-report.log; then
            echo 'ERROR: Weekly Report did not prove a Drive save.' >&2
            exit 1
          fi
          if ! grep -Fq 'Email sent to' /tmp/weekly-report.log; then
            echo 'ERROR: Weekly Report did not prove email delivery.' >&2
            exit 1
          fi

          echo 'Weekly Report generated, saved, and delivered successfully.'

      - name: Notify failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `❌ Weekly Report failed — ${new Date().toLocaleDateString('en-US', {timeZone:'America/New_York'})}`,
              body:  `The weekly report generator failed.\n[View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ["automation", "bug"],
            });
