name: JS/TS Quality Gate

# NO `paths:` FILTER — deliberate, do not re-add.
# These two jobs are REQUIRED status checks on `main`. A required check that is
# skipped by a path filter never reports a conclusion, so GitHub leaves it
# "Expected — waiting for status" and the PR can never merge. A docs-only PR
# would be blocked forever. Both jobs finish in ~20s, so running them on every
# PR is far cheaper than the deadlock.
# See: https://docs.github.com/en/actions/how-tos/manage-workflow-runs/skip-workflow-runs
#
# Automated writers (nonnegotiables, ads_pulse, ads_approval_watcher) cannot push
# directly to main under ruleset 20720805 — required checks apply to pushes and
# there is no bypass actor. They open a PR instead, so the `pull_request` trigger
# below is what gates them, exactly as it gates a human.
#
# workflow_dispatch is kept for manual re-runs. It is NOT the bot mechanism: an
# earlier design dispatched this workflow against a temp branch and then pushed
# the pre-validated SHA to main. That was tested and REJECTED by GitHub — both
# required checks reported success on the exact SHA and the push was still
# refused with "2 of 2 required status checks are expected". Ruleset push
# evaluation does not honour pre-existing check runs. Do not retry that design.
# See scripts/ci/push_prevalidated_main.sh
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-js-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complexity:
    name: ESLint complexity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install quality dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce JS/TS complexity
        run: pnpm quality:js

  remotion-typecheck:
    name: Remotion typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/remotion/package-lock.json

      - name: Install locked Remotion dependencies
        working-directory: scripts/remotion
        run: npm ci --include=dev

      - name: Typecheck Remotion
        working-directory: scripts/remotion
        run: npm run typecheck
