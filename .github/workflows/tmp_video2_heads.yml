name: tmp-video2-heads
on:
  push:
    branches: [tmp-video2]
    paths: ['tmp_v2/heads/titles.json']
permissions:
  contents: write
jobs:
  heads:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: tmp-video2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          pip install -q "rembg[cpu]" pillow
          python3 tmp_v2/heads/heads.py > tmp_v2/heads/log.txt 2>&1 || true
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add tmp_v2/heads && git commit -m heads && for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 5; done
