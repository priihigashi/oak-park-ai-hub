name: tmp tomate snip
on:
  push:
    branches: [tmp/tomate-tx]
    paths: [".github/workflows/tmp_tomate_snip.yml", "tomate_in/snip.txt"]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
        with: {ref: tmp/tomate-tx}
      - uses: actions/setup-python@v5.6.0
        with: {python-version: "3.11"}
      - run: pip install -q -U edge-tts
      - name: tts
        run: |
          mkdir -p tomate_media
          python - <<'PY'
          import asyncio, json, time, traceback, edge_tts
          txt = open("tomate_in/snip.txt", encoding="utf-8").read().replace("\n", " ")
          async def go():
              c = edge_tts.Communicate(txt, "pt-BR-ThalitaMultilingualNeural", rate="+8%", boundary="WordBoundary")
              words = []
              with open("tomate_media/snip.mp3", "wb") as f:
                  async for ch in c.stream():
                      if ch["type"] == "audio": f.write(ch["data"])
                      elif ch["type"] == "WordBoundary":
                          words.append([ch["text"], round(ch["offset"]/1e7, 3), round((ch["offset"]+ch["duration"])/1e7, 3)])
              json.dump(words, open("tomate_media/snip.json", "w"), ensure_ascii=False)
          for k in range(5):
              try:
                  asyncio.run(go()); print("ok"); break
              except Exception:
                  traceback.print_exc(); time.sleep(15)
          PY
      - name: commit
        run: |
          git config user.name "tomate-bot"; git config user.email "bot@example.com"
          git add tomate_media && git commit -m "snip output" && (git push origin HEAD:tmp/tomate-tx || (git pull --rebase -X theirs origin tmp/tomate-tx && git push origin HEAD:tmp/tomate-tx))
