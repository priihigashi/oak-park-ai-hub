name: tmp-raul-build
on:
  push:
    branches: [tmp-raul]
    paths: ['tmp_raul/job.json', 'tmp_raul/run.py', '.github/workflows/tmp_raul.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11"}
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: pip install edge-tts faster-whisper "rembg[cpu]" mediapipe==0.10.14 pillow numpy
      - name: Run
        env:
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
        run: python tmp_raul/run.py
      - name: Commit outputs
        run: |
          git config user.name "tmp-bot"; git config user.email "tmp-bot@users.noreply.github.com"
          git add tmp_raul/out
          git commit -m "tmp_raul outputs" || echo nothing
          git push
