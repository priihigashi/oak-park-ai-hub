name: Content routing contract (no paid APIs)
on:
  pull_request:
    paths:
      - 'scripts/content_dispatch.py'
      - 'scripts/routing.py'
      - 'tests/test_content_dispatch.py'
      - 'docs/CONTENT_ROUTING.md'
      - '.github/workflows/content_routing_checks.yml'
permissions:
  contents: read
concurrency:
  group: content-routing-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  routing-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Synthetic routing and adapter-handoff fixtures
        run: python -m unittest discover -s tests -p 'test_content_dispatch.py' -v
