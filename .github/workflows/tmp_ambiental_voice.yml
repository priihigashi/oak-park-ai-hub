name: tmp ambiental voice
on:
  push:
    branches: [tmp-ambiental-dl]
    paths: [tmp_voice/run.sh, tmp_voice/script.json]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg >/dev/null
      - run: bash tmp_voice/run.sh 2>&1 | tee tmp_voice/run.log; mkdir -p tmp_voice/out; cp tmp_voice/run.log tmp_voice/out/
      - run: |
          git config user.name tmp-bot; git config user.email tmp@bot
          git add -f tmp_voice/out && git commit -qm "tmp: voice out" && for i in 1 2 3 4; do git pull -q --rebase && git push && break; sleep 7; done
