name: reel PLP 299 - baixar vozes
on:
  push:
    branches: [reel/plp299-fix]
    paths: ["reels/plp299-fix/urls.json"]
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reel/plp299-fix
      - run: |
          mkdir -p reels/plp299-fix/vozes
          i=0; for u in $(jq -r '.[]' reels/plp299-fix/urls.json); do curl -sSL -o reels/plp299-fix/vozes/v$i.mp3 "$u"; i=$((i+1)); done
          ls -la reels/plp299-fix/vozes
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reels/plp299-fix/vozes; git commit -m "vozes [skip ci]"; git push
