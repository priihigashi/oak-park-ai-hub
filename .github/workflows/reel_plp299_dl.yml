name: reel PLP 299 - baixar video original
on:
  push:
    branches: [reel/plp299-fix]
    paths: ["reels/plp299-fix/orig_url.txt"]
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reel/plp299-fix
      - run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p reels/plp299-fix/orig
          curl -sSL -o /tmp/o.mp4 "$(cat reels/plp299-fix/orig_url.txt)"
          ls -la /tmp/o.mp4; ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,r_frame_rate,sample_rate,bit_rate -of compact /tmp/o.mp4 | tee reels/plp299-fix/orig/info.txt
          split -b 90m /tmp/o.mp4 reels/plp299-fix/orig/o.mp4.part_
          ls -la reels/plp299-fix/orig
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reels/plp299-fix/orig; git commit -m "video original [skip ci]"; git push
