name: reel job (tmp)
on: push
permissions:
  contents: write
jobs:
  run:
    if: "!contains(github.event.head_commit.message, '[out]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: pip install -q edge-tts "rembg[cpu]" mediapipe==0.10.14 pillow numpy
      - run: python job.py
      - name: commit outputs
        run: |
          git config user.name "reel-bot"; git config user.email "reel-bot@users.noreply.github.com"
          git add out && git commit -m "outputs [out]" && git push
