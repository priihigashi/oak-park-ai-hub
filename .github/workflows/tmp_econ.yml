name: tmp-economia
on:
  push:
    branches: [tmp-economia]
permissions:
  contents: write
jobs:
  work:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    if: "!contains(github.event.head_commit.message, '[out]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: tools
        run: |
          pip install -q faster-whisper edge-tts static-ffmpeg "rembg[cpu]" "mediapipe==0.10.14" requests pillow numpy
          static_ffmpeg_paths
          D=$(python -c "import os;from static_ffmpeg import run;f,p=run.get_or_fetch_platform_executables_else_raise();print(os.path.dirname(f))")
          echo "$D" >> $GITHUB_PATH
      - name: run
        continue-on-error: true
        run: python job/run.py 2>&1 | tee res_log.txt; mkdir -p res; mv res_log.txt res/log.txt
      - name: commit
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add res && git commit -q -m "[out] res" && git push
