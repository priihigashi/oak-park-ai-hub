name: tmp-economia
on:
  push:
    branches: [tmp-economia]
permissions:
  contents: write
  actions: read
jobs:
  work:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: "!contains(github.event.head_commit.message, '[out]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: capture-39982611229-brazil
          run-id: 39982611229
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: cap
      - name: tools
        run: |
          pip install -q faster-whisper edge-tts static-ffmpeg
          static_ffmpeg_paths
          D=$(python -c "import static_ffmpeg,os;from static_ffmpeg import run;f,p=run.get_or_fetch_platform_executables_else_raise();print(os.path.dirname(f))")
          echo "$D" >> $GITHUB_PATH
      - name: process
        run: |
          mkdir -p out
          find cap -type f -exec ls -la {} \; > out/listing.txt
          V=$(find cap -type f \( -name '*.mp4' -o -name '*.mov' -o -name '*.webm' \) | head -1)
          echo "video: $V" >> out/listing.txt
          cp cap/*.txt out/ 2>/dev/null || true
          find cap -name '*.txt' -o -name '*.srt' -o -name '*.json' | head -20 | xargs -I{} cp {} out/ 2>/dev/null || true
          ffprobe -v error -show_entries format=duration -of csv=p=0 "$V" > out/duration.txt
          cp "$V" out/orig.mp4
          ffmpeg -y -loglevel error -i "$V" -vf scale=432:768,fps=24 -c:v libx264 -preset slow -crf 32 -g 48 -pix_fmt yuv420p -c:a aac -b:a 64k -ac 1 -movflags +faststart out/original_leve.mp4
          ffmpeg -y -loglevel error -ss 1 -i "$V" -frames:v 1 -vf scale=432:-2 out/original_leve.jpg
          ffmpeg -y -loglevel error -i "$V" -vf "fps=1/3,scale=216:-2,tile=6x6" -frames:v 1 out/sheet.jpg
          ffmpeg -y -loglevel error -i "$V" -ar 16000 -ac 1 out/a.wav
          python - <<'PY'
          from faster_whisper import WhisperModel
          import json
          m=WhisperModel('medium',compute_type='int8')
          segs,info=m.transcribe('out/a.wav',language='pt',word_timestamps=True,vad_filter=False)
          W=[];T=[]
          for s in segs:
              T.append(f"[{s.start:.1f}-{s.end:.1f}] {s.text.strip()}")
              for w in s.words: W.append([w.word.strip(),round(w.start,3),round(w.end,3)])
          open('out/whisper.txt','w').write('\n'.join(T))
          json.dump(W,open('out/words.json','w'),ensure_ascii=False)
          PY
          rm out/a.wav
      - name: commit
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add out && git commit -m "[out] results" && git push
