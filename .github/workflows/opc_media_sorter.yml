name: OPC Media Sorter — Daily Job Video Sort

on:
  schedule:
    - cron: '35 22 * * *'   # 6:35 PM ET (22:35 UTC) — runs before photo_catalog_cloud at 7:35 PM ET
  workflow_dispatch:         # Manual trigger anytime

permissions:
  contents: read

jobs:
  sort:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install google-auth google-auth-httplib2 google-api-python-client

      - name: Write sheets token
        env:
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
        run: echo "$SHEETS_TOKEN" > /tmp/sheets_token.json

      - name: Sort videos
        env:
          SHEETS_TOKEN_PATH: /tmp/sheets_token.json
          GITHUB_RUN_ID:     ${{ github.run_id }}
        run: python scripts/opc_media_sorter.py

      - name: Email alert on failure
        if: failure()
        env:
          PRI_OP_GMAIL_APP_PASSWORD: ${{ secrets.PRI_OP_GMAIL_APP_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import os, smtplib
          from email.message import EmailMessage
          msg = EmailMessage()
          msg['Subject'] = '🚨 opc_media_sorter.yml FAILED — run ${{ github.run_id }}'
          msg['From'] = 'priscila@oakpark-construction.com'
          msg['To']   = 'priscila@oakpark-construction.com'
          msg.set_content(
              "opc_media_sorter.yml failed on run ${{ github.run_id }}.\n\n"
              "Logs: https://github.com/priihigashi/oak-park-ai-hub/actions/runs/${{ github.run_id }}\n"
          )
          s = smtplib.SMTP_SSL('smtp.gmail.com', 465)
          s.login('priscila@oakpark-construction.com', os.environ['PRI_OP_GMAIL_APP_PASSWORD'])
          s.send_message(msg)
          s.quit()
          PYEOF
