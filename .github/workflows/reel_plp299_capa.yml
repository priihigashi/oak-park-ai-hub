name: reel PLP 299 - baixar capa
on:
  push:
    branches: [reel/plp299-fix]
    paths: ["reels/plp299-fix/capa_url.txt"]
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: reel/plp299-fix}
      - run: |
          curl -sSL -o reels/plp299-fix/capa.jpeg "$(cat reels/plp299-fix/capa_url.txt)"
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reels/plp299-fix/capa.jpeg; git commit -m "capa [skip ci]"; git push
