name: Skills Fetch ChatGPT versions (read-only)

on:
  push:
    branches: [skills/colonization-br-mirror]
    paths:
      - 'scripts/skills_fetch_chatgpt.py'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-auth google-api-python-client
      - name: Download ChatGPT folders
        env:
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
        run: python scripts/skills_fetch_chatgpt.py
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt_dump
          path: chatgpt_dump
          retention-days: 3
