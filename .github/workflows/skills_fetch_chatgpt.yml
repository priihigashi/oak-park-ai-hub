name: Skills Fetch ChatGPT versions (read-only)

on:
  push:
    branches: [skills/colonization-br-mirror]
    paths:
      - 'scripts/skills_fetch_chatgpt.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-auth google-api-python-client
      - name: Download ChatGPT folders
        env:
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
        run: python scripts/skills_fetch_chatgpt.py
      - name: Unzip and commit dump to branch
        run: |
          cd chatgpt_dump
          find . -name '*.zip' | while read z; do mkdir -p "${z%.zip}_unzipped"; unzip -oq "$z" -d "${z%.zip}_unzipped"; rm "$z"; done
          cd ..
          git config user.name skills-sync-bot
          git config user.email actions@github.com
          git add chatgpt_dump
          git commit -m "skills: ChatGPT versions snapshot [skip ci]" || exit 0
          git push
