name: Reel assets (voz provisória + imagens Commons)

# Gera a voz provisória grátis (edge-tts, Thalita) e baixa candidatas de imagem do Wikimedia Commons
# para um reel em docs/templates/collage_reel/data/<slug>/. Dispara quando o arquivo REQUEST do reel muda.
on:
  push:
    branches: ["feat/*-reel", "feat/collage-reel-format"]
    paths: ["docs/templates/collage_reel/data/*/REQUEST"]
  workflow_dispatch:
    inputs:
      slug: { description: "pasta em data/", required: true }

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -U edge-tts
      - name: Descobre o reel
        id: slug
        run: |
          if [ -n "${{ github.event.inputs.slug }}" ]; then echo "slug=${{ github.event.inputs.slug }}" >> $GITHUB_OUTPUT; exit 0; fi
          s=$(git diff --name-only HEAD~1 HEAD | grep -oP 'collage_reel/data/\K[^/]+(?=/REQUEST)' | head -1)
          echo "slug=$s" >> $GITHUB_OUTPUT
      - name: Gera conforme REQUEST
        run: |
          D=docs/templates/collage_reel/data/${{ steps.slug.outputs.slug }}
          K=docs/templates/collage_reel/preview_kit
          set +e
          L="$D/assets_log.txt"; pip show edge-tts | head -2 > "$L"
          if grep -q tts "$D/REQUEST"; then python3 $K/tts_edge.py "$D" >> "$L" 2>&1; fi
          if grep -q images "$D/REQUEST"; then PER=2 python3 $K/commons_fetch.py "$D" >> "$L" 2>&1; fi
          if grep -q atlas "$D/REQUEST"; then python3 $K/atlas_fetch.py "$D" 20 328 329 330 >> "$L" 2>&1; fi
          tail -40 "$L"; exit 0
      - name: Commit
        run: |
          git config user.name "reel-assets-bot"; git config user.email "actions@github.com"
          git add -A docs/templates/collage_reel/data
          git commit -m "reel assets: ${{ steps.slug.outputs.slug }}" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
