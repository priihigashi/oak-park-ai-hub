name: fetch-voice-ajude-votar
on:
  push:
    branches: ['media/ajude-votar-2026-10-25']
    paths: ['.github/workflows/fetch-voice-ajude.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o media-share/2026-10-25-ajude-votar/voice.mp3 'https://storage.googleapis.com/xi-backend/database/workspace/cfd0c30d08bb461c800962f2f06538b3/content_generation/E0rWFsobI5cjmgVqaTqA/1uFgPLAV6grRftdfPJHb/content.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20261025%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261025T205830Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-'
          ls -la media-share/2026-10-25-ajude-votar
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add media-share/2026-10-25-ajude-votar/voice.mp3
          git commit -m "voice mp3"
          git push
